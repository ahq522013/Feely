<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Feely</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            font-family: 'Readex Pro', sans-serif;
            background-color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, #fcfbfa 0%, #ffffff 70%);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            padding-top: var(--safe-top);
            padding-bottom: calc(1.75rem + var(--safe-bottom));
        }

        /* Pure Beige Cards over White Background */
        .glass-card {
            background: #f5efe6;
            border-radius: 30px;
            box-shadow: 0 10px 26px -14px rgba(159, 18, 57, 0.12), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            border: 1px solid #e7ddd0;
        }

        .soft-input {
            background: #ffffff;
            border: 1.5px solid #dfd3c3;
            color: #1e293b;
            border-radius: 18px;
            font-size: 16px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .soft-input:focus {
            border-color: #b91c3c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(185, 28, 60, 0.12);
        }

        /* Compact Beige Box Inputs */
        .white-compact-box {
            background: #efe7dc;
            border: 1.5px solid #dfd3c3;
            border-radius: 16px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .white-compact-box:focus-within {
            border-color: #b91c3c;
            background: #f7f2ea;
            box-shadow: 0 0 0 3px rgba(185, 28, 60, 0.12);
        }

        /* Unified Right-Aligned Small Field Typography */
        .unified-field-text {
            font-family: 'Readex Pro', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            color: #334155;
        }
        .unified-field-text::placeholder {
            font-family: 'Readex Pro', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: normal;
            color: #8c8275;
        }

        /* Story Avatar Ring (Deep Crimson Tone) */
        .story-ring {
            background: linear-gradient(135deg, #b91c3c 0%, #881337 100%);
            padding: 2.5px;
            border-radius: 9999px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .story-ring-selected {
            box-shadow: 0 0 0 2.5px #f5efe6, 0 0 0 4.5px #9f1239;
            transform: scale(1.04);
        }

        /* Pulse Item Card (Pure Beige) */
        .pulse-item-card {
            background: #efe7dc;
            border: 1.5px solid #dfd3c3;
            border-radius: 20px;
            box-shadow: 0 4px 12px -6px rgba(159, 18, 57, 0.08);
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .pulse-item-card:hover {
            border-color: #b91c3c;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px -8px rgba(159, 18, 57, 0.14);
        }

        /* Heart Send Button & Circular Progress Ring */
        @keyframes heartHalo {
            0% { box-shadow: 0 0 0 0 rgba(159, 18, 57, 0.25); }
            70% { box-shadow: 0 0 0 14px rgba(159, 18, 57, 0); }
            100% { box-shadow: 0 0 0 0 rgba(159, 18, 57, 0); }
        }
        .heart-send-btn {
            animation: heartHalo 2.2s infinite;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .heart-charging {
            animation: none !important;
            box-shadow: 0 0 0 12px rgba(159, 18, 57, 0.14), 0 12px 28px -6px rgba(136, 19, 55, 0.35);
            transform: scale(1.05);
        }

        /* Floating Hearts Animation */
        @keyframes floatHeartUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            60% { opacity: 0.95; }
            100% { transform: translateY(-88dvh) scale(1.4) rotate(var(--rot, 20deg)); opacity: 0; }
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            z-index: 9999;
            animation: floatHeartUp var(--dur, 2.4s) cubic-bezier(0.22, 1, 0.36, 1) forwards;
            user-select: none;
        }

        /* Unified Centered Toast Notification */
        @keyframes toastCenterDrop {
            0% { transform: translateY(-24px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .toast-enter {
            animation: toastCenterDrop 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Small Mini Pill next to Incognito Button */
        @keyframes miniPillPop {
            0% { opacity: 0; transform: translateX(6px) scale(0.94); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .mini-pill-pop {
            animation: miniPillPop 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes sheetPopIn {
            0% { opacity: 0; transform: translateY(16px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .sheet-pop-in {
            animation: sheetPopIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dfd3c3; border-radius: 10px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body class="text-slate-800 min-h-[100dvh] flex flex-col justify-between antialiased selection:bg-rose-900/15 selection:text-rose-900">

    <!-- عداد شفاف ~50% يظهر فوق مكان ضغط الإصبع أثناء الشحن ويختفي عند الإفلات -->
    <div id="fingerChargeCounter"
         style="left: 0px; top: 0px; transform: translate(-50%, -145%) scale(0.88);"
         class="fixed z-[9998] opacity-0 pointer-events-none transition-opacity duration-150 px-3.5 py-1 rounded-full bg-slate-900/50 backdrop-blur-sm border border-white/25 shadow-md flex items-center gap-1.5">
        <span class="size-1.5 rounded-full bg-rose-400"></span>
        <span id="rangeDisplay" class="text-xs font-black text-white/95 tabular-nums tracking-tight">0%</span>
    </div>

    <!-- حاوية الإشعارات الموحدة في منتصف الشاشة -->
    <div id="toastContainer" style="top: calc(1rem + var(--safe-top));" class="fixed inset-x-0 mx-auto z-[9999] pointer-events-none px-4 flex flex-col items-center justify-center w-full max-w-sm"></div>

    <!-- Header العلوي الموحد -->
    <header class="w-full max-w-md mx-auto px-3.5 sm:px-5 pt-4 sm:pt-6 flex justify-between items-center gap-1.5">
        <div id="authStatusContainer" class="flex items-center gap-1 sm:gap-1.5 flex-wrap">
            <!-- أيقونة حفظ الحساب / خروج -->
            <button id="openAuthModalBtn" onclick="openAuthModal()" title="حفظ الحساب"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] hover:bg-[#efe7dc] text-slate-700 border border-[#dfd3c3] transition shadow-2xs active:scale-95">
                <svg class="w-4 h-4 text-[#9f1239]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
            </button>
            <button id="logoutBtn" onclick="logout()" title="خروج"
                    class="hidden grid size-8 sm:size-9 place-items-center rounded-full bg-[#efe7dc] hover:bg-[#e5dacb] text-[#9f1239] border border-[#dfd3c3] transition active:scale-95">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>

            <!-- زر النبض (الرئيسية) -->
            <button type="button" id="navHomeBtn" onclick="switchMainView('home')" title="النبض"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#9f1239] text-white shadow-sm shadow-rose-900/20 transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
            </button>

            <!-- زر صفحة أصدقاء النبض المستقلة -->
            <button type="button" id="navFriendsBtn" onclick="switchMainView('friends')" title="أصدقاء النبض"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] border border-[#dfd3c3] shadow-2xs transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </button>

            <!-- زر عدسة البحث -->
            <button type="button" id="navSearchBtn" onclick="switchMainView('search')" title="بحث"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] border border-[#dfd3c3] shadow-2xs transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>

            <!-- زر البروفايل الشخصي -->
            <button type="button" id="navProfileBtn" onclick="switchMainView('profile')" title="ملفي"
                    class="relative grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] border border-[#dfd3c3] shadow-2xs transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span id="profileAlertDot" class="hidden absolute right-1.5 top-1.5 size-2 rounded-full bg-[#9f1239] ring-2 ring-[#f5efe6]"></span>
            </button>

            <!-- أيقونة الإشعارات -->
            <button id="notificationBellBtn" onclick="handleBellClick()" title="الإشعارات" 
                    class="relative grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] transition border border-[#dfd3c3] shadow-2xs active:scale-90">
                <svg id="bellSvgIcon" class="w-4 h-4 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
                <span id="bellBadge" class="hidden absolute right-1.5 top-1.5 flex size-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-500 opacity-75"></span>
                    <span class="relative inline-flex rounded-full size-2.5 bg-[#9f1239] ring-2 ring-[#f5efe6]"></span>
                </span>
            </button>

            <!-- زر نغمة النبض -->
            <button id="soundToggleBtn" onclick="toggleSoundEffect()" title="الصوت" 
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] transition border border-[#dfd3c3] shadow-2xs active:scale-90">
                <span id="soundIcon" class="flex items-center justify-center"></span>
            </button>
        </div>

        <!-- الشعار -->
        <div onclick="switchMainView('home')" class="flex items-center gap-2 cursor-pointer select-none group shrink-0">
            <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight leading-none">Feely</h1>
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-2xl bg-gradient-to-tr from-[#881337] via-[#9f1239] to-[#be123c] flex items-center justify-center text-white shadow-md shadow-rose-900/20 group-active:scale-95 transition">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-white" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-md mx-auto px-3.5 sm:px-4 py-4 flex-grow">

        <!-- ==================== VIEW 1: HOME ==================== -->
        <div id="viewHome" class="space-y-3.5">

            <!-- بطاقة الهوية المصغرة في الأعلى (بيج صافي) -->
            <div onclick="switchMainView('profile')" class="glass-card px-4 py-3 flex items-center justify-between cursor-pointer hover:border-[#b91c3c] transition active:scale-[0.99]">
                <span class="inline-flex items-center gap-1.5 text-xs font-black text-[#9f1239] bg-[#efe7dc] border border-[#dfd3c3] px-3 py-1 rounded-full tabular-nums" id="miniHeartsBadge">
                    <svg class="w-3.5 h-3.5 fill-[#9f1239]" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span>0</span>
                </span>
                <div class="flex items-center gap-2 min-w-0">
                    <span id="miniHandleDisplay" class="unified-field-text uppercase truncate">فعّل رمزك</span>
                    <div class="size-7 rounded-full bg-[#efe7dc] border border-[#dfd3c3] text-[#9f1239] flex items-center justify-center shrink-0">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- بطاقة صفحة الصديق (عند فتح رابط مباشر ?u=...) -->
            <section id="friendProfileCard" class="hidden glass-card p-4 sm:p-5 relative overflow-hidden space-y-3 border-2 border-[#b91c3c]">
                <div class="flex items-center justify-between">
                    <button type="button" onclick="closeFriendProfile()" class="grid size-7 place-items-center text-slate-600 hover:text-slate-900 bg-[#efe7dc] rounded-full border border-[#dfd3c3] transition active:scale-95">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                    <span id="friendProfileStreakText" class="inline-flex items-center gap-1 text-xs font-black text-[#9f1239] tabular-nums">
                        <svg class="w-3.5 h-3.5 fill-[#9f1239]" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>0</span>
                    </span>
                </div>

                <div class="flex items-center justify-between gap-2 bg-[#efe7dc] rounded-2xl px-3.5 py-3 border border-[#dfd3c3]">
                    <span class="inline-flex items-center gap-1.5 text-xs font-black text-[#9f1239] bg-[#f5efe6] border border-[#dfd3c3] px-3 py-1.5 rounded-full shrink-0 tabular-nums" id="friendHeartsReceivedBadge">
                        <svg class="w-3.5 h-3.5 fill-[#9f1239]" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>0</span>
                    </span>

                    <div class="flex items-center gap-2 min-w-0">
                        <span id="friendProfileHandle" class="font-mono text-xl font-black tracking-[0.22em] text-slate-900 uppercase truncate">---</span>
                        <button type="button" onclick="copyFriendLink()" title="نسخ"
                                class="p-1.5 text-slate-600 hover:text-[#9f1239] hover:bg-[#f5efe6] rounded-xl transition active:scale-90 shrink-0">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- بطاقة إرسال النبضة (بيج صافي + أحمر قاتم) -->
            <section class="glass-card p-5 sm:p-6 space-y-3 relative">
                <!-- أيقونة التصفح الخفي وبوكس تنبيه صغير متناسق بجانبها -->
                <div class="absolute top-4 right-4 z-10 flex items-center gap-1.5">
                    <button type="button" id="anonymousToggleBtn" onclick="toggleAnonymousMode()" title="التصفح الخفي"
                            class="grid size-8 place-items-center rounded-full bg-[#efe7dc] text-slate-600 border border-[#dfd3c3] hover:border-[#b91c3c] transition-all active:scale-90 shrink-0">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 11h18"/>
                            <path d="M5 11l2-6c.3-.9 1.1-1.5 2-1.5h6c.9 0 1.7.6 2 1.5l2 6"/>
                            <circle cx="7.5" cy="16.5" r="2.5"/>
                            <circle cx="16.5" cy="16.5" r="2.5"/>
                            <path d="M10 16.5h4"/>
                        </svg>
                    </button>

                    <div id="anonMiniPill" class="hidden mini-pill-pop px-2.5 py-1 rounded-full bg-[#efe7dc] border border-[#dfd3c3] shadow-2xs">
                        <span id="anonMiniPillText" class="text-[10px] font-bold text-[#9f1239] leading-none">تفعيل وضع التخفي</span>
                    </div>
                </div>

                <div class="text-center space-y-2.5 pt-2 relative">
                    <!-- زر القلب الدائري مع إطار الشحن الدائري حوله -->
                    <div class="relative inline-flex flex-col items-center justify-center">
                        <button type="button" id="mainHeartOrb"
                                onpointerdown="startHeartCharge(event)"
                                oncontextmenu="return false;"
                                class="heart-send-btn relative inline-flex items-center justify-center w-28 h-28 rounded-full bg-[#efe7dc] border border-[#dfd3c3] shadow-md cursor-pointer select-none transition-all duration-150">
                            
                            <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 100 100">
                                <defs>
                                    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#be123c"/>
                                        <stop offset="50%" stop-color="#9f1239"/>
                                        <stop offset="100%" stop-color="#881337"/>
                                    </linearGradient>
                                </defs>
                                <circle cx="50" cy="50" r="45" fill="none" stroke="#e5dacb" stroke-width="5.5"/>
                                <circle id="circularChargeRing" cx="50" cy="50" r="45" fill="none"
                                        stroke="url(#ringGrad)" stroke-width="5.5" stroke-linecap="round"
                                        stroke-dasharray="282.74" stroke-dashoffset="282.74"/>
                            </svg>

                            <!-- القلب بلون أحمر قاتم متزن ومع حد أسود عند تفعيل وضع التخفي -->

        function getOrderedFriendsList() {

            const pinnedUpper = pinnedFriends.map(h => h.toUpperCase());
            const combined = [...new Set([...sentTargets, ...pinnedUpper])];
            return combined.filter(h => !hiddenFriends.includes(h));

        // ================= FORMAT EXACT DATE & TIME =================
        function formatExactDateTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const timeStr = d.toLocaleTimeString('ar-SA', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year} · ${timeStr}`;
        }

                if (hiddenFriends.includes(code)) {
                    hiddenFriends = hiddenFriends.filter(f => f !== code);

                if (!pinnedFriends.includes(code)) {

        // ================= UNIFIED CENTERED TOAST NOTIFICATION (BEIGE THEME) =================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const isError = type === 'error';
            const toast = document.createElement('div');
            toast.className = `toast-enter w-full flex items-center justify-between gap-2.5 px-4 py-3 rounded-2xl bg-[#f5efe6]/95 backdrop-blur-md shadow-xl shadow-stone-900/10 border ${
                isError ? 'border-[#9f1239]' : 'border-[#dfd3c3]'
            } text-xs font-bold text-slate-800 mb-2`;

            const badgeHTML = isError
                ? `<span class="size-6 rounded-full bg-[#9f1239] text-white font-black flex items-center justify-center shrink-0 shadow-2xs">!</span>`
                : `<span class="size-6 rounded-full bg-gradient-to-tr from-[#881337] to-[#be123c] text-white flex items-center justify-center shrink-0 shadow-2xs">${ICONS.check}</span>`;

            toast.innerHTML = `
                ${badgeHTML}
                <span class="flex-1 text-center leading-snug text-slate-800">${message}</span>
                <span class="size-6 shrink-0"></span>
            `;

            container.innerHTML = '';
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-14px) scale(0.96)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 260);
            }, 3000);
        }

        function updateLoveMeterUI(val) {
            const clamped = Math.max(0, Math.min(100, Math.round(val)));
            currentLoveValue = clamped;
            document.getElementById('rangeDisplay').textContent = clamped + '%';

            const svg = document.getElementById('dynamicHeartSvg');
            if (svg) {
                const scale = 0.68 + (clamped / 100) * 0.74;
                svg.style.transform = `scale(${scale.toFixed(3)})`;
            }

            const ring = document.getElementById('circularChargeRing');
            if (ring) {
                const offset = RING_CIRCUMFERENCE * (1 - clamped / 100);
                ring.style.strokeDashoffset = offset.toFixed(2);
            }
        }

        function handleGlobalPointerMove(e) {
            if (!isChargingHeart) return;
            positionFingerCounter(e.clientX, e.clientY);
        }

        function handleGlobalPointerUp() {
            if (!isChargingHeart) return;
            finishHeartChargeAndOpenSheet();
        }

        function attachGlobalChargeListeners() {
            window.addEventListener('pointermove', handleGlobalPointerMove, { passive: true });
            window.addEventListener('pointerup', handleGlobalPointerUp);
            window.addEventListener('pointercancel', handleGlobalPointerUp);
        }

        function detachGlobalChargeListeners() {
            window.removeEventListener('pointermove', handleGlobalPointerMove);
            window.removeEventListener('pointerup', handleGlobalPointerUp);
            window.removeEventListener('pointercancel', handleGlobalPointerUp);
        }

        function startHeartCharge(e) {
            if (e) e.preventDefault();
            if (isSendingPulse || isChargingHeart) return;

            isChargingHeart = true;
            const orb = document.getElementById('mainHeartOrb');
            if (orb) orb.classList.add('heart-charging');

            let val = 0;
            updateLoveMeterUI(val);
            if (typeof e.clientX === 'number' && typeof e.clientY === 'number') {
                positionFingerCounter(e.clientX, e.clientY);
            }
            setFingerCounterVisible(true);
            attachGlobalChargeListeners();
            if (navigator.vibrate) navigator.vibrate(12);

            chargeDelayTimer = setTimeout(() => {
                if (!isChargingHeart) return;

                const tick = () => {
                    if (!isChargingHeart || val >= 100) return;
                    val += 1;
                    updateLoveMeterUI(val);

                    if ([25, 50, 75, 100].includes(val) && navigator.vibrate) {
                        navigator.vibrate(val === 100 ? [30, 40, 30] : 15);
                    }

                    const progress = val / 100;
                    const nextDelay = Math.max(8, Math.round(40 * Math.pow(1 - progress, 1.45)));
                    chargeStepTimer = setTimeout(tick, nextDelay);
                };

                tick();
            }, 220);
        }

        function finishHeartChargeAndOpenSheet() {
            if (!isChargingHeart) return;

            clearTimeout(chargeDelayTimer);
            clearTimeout(chargeStepTimer);
            chargeDelayTimer = null;
            chargeStepTimer = null;
            isChargingHeart = false;
            detachGlobalChargeListeners();

            const orb = document.getElementById('mainHeartOrb');
            if (orb) orb.classList.remove('heart-charging');
            setFingerCounterVisible(false);

            const selectedScore = currentLoveValue;
            setTimeout(() => {
                if (!isChargingHeart) updateLoveMeterUI(0);
            }, 250);

            openSendPulseSheet(selectedScore);
        }

        function playHeartbeatSound() {
            if (!isSoundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();

                const beat = (delay, freq, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
                    osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + delay + duration);

                    gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + delay + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + delay);
                    osc.stop(ctx.currentTime + delay + duration + 0.02);
                };

                beat(0, 125, 0.16);
                beat(0.20, 105, 0.22);
            } catch (e) {}
        }

                    const leftPos = Math.random() * 86 + 7;
                    const duration = Math.random() * 1.4 + 1.8;

                    heart.style.left = leftPos + 'vw';

        // ================= FIREBASE CLOUD STREAK LOGIC =================
        function getFirebasePairKey(handle1, handle2) {
            if (!handle1 || !handle2) return null;
            const h1 = handle1.trim().toUpperCase();
            const h2 = handle2.trim().toUpperCase();
            return [h1, h2].sort().join('_');
        }

        function checkTargetStreak(target, callback) {
            const trimmedTarget = target.trim().toUpperCase();
            const badge = document.getElementById('targetStreakIndicator');
            
            if (!badge) return;
            if (trimmedTarget.length < 1 || !userHandle || !currentUser) {
                badge.classList.add('hidden');
                if (callback) callback(0);
                return;
            }

            const pairKey = getFirebasePairKey(userHandle, trimmedTarget);
            if (!pairKey) return;

            db.ref('streaks/' + pairKey).once('value', snapshot => {
                const data = snapshot.val() || { streak: 0, lastDate: "" };
                const yesterday = new Date(Date.now() - 86400000).toDateString();
                const today = new Date().toDateString();

                let currentStreak = data.streak || 0;
                if (data.lastDate && data.lastDate !== today && data.lastDate !== yesterday) {
                    currentStreak = 0;
                }

                activeStreaksCache[trimmedTarget] = currentStreak;
                badge.innerHTML = `${ICONS.heartSmall} <span>${currentStreak}</span>`;
                badge.classList.remove('hidden');
                if (callback) callback(currentStreak);
            });
        }

        function recordTargetStreakInCloud(senderHandle, targetHandle) {
            const pairKey = getFirebasePairKey(senderHandle, targetHandle);
            if (!pairKey) return;

            db.ref('streaks/' + pairKey).once('value', snapshot => {
                const data = snapshot.val() || { streak: 0, lastDate: "" };
                const today = new Date().toDateString();
                const yesterday = new Date(Date.now() - 86400000).toDateString();

                let newStreak = data.streak || 0;
                if (data.lastDate === yesterday) {
                    newStreak += 1;
                } else if (data.lastDate === today) {
                    newStreak = newStreak === 0 ? 1 : newStreak;
                } else {
                    newStreak = 1;
                }

                db.ref('streaks/' + pairKey).set({
                    streak: newStreak,
                    lastDate: today,
                    updatedAt: Date.now(),
                    pair: [senderHandle, targetHandle]
                }).then(() => {
                    activeStreaksCache[targetHandle] = newStreak;
                    checkTargetStreak(targetHandle);
                    if (activeFriendHandle === targetHandle) {
                        document.getElementById('friendProfileStreakText').innerHTML = `${ICONS.heartFill} <span>${newStreak}</span>`;
                    }
                    renderPulsesList();
                    renderFriendsManagePage();
                });
            });
        }

        function getEffectiveSenderIdentity() {
            if (isAnonymousMode || !userHandle) {
                return { name: 'مجهول', handle: 'مجهول' };
            }
            return { name: userHandle, handle: userHandle };
        }

        function sendPulseToMultipleTargets(targetHandles, score, note) {
            if (isSendingPulse) return;
            if (!currentUser) return showToast('جاري الاتصال...', 'error');

            const cleanTargets = [...new Set(targetHandles.map(h => h.trim().toUpperCase()).filter(Boolean))];
            if (cleanTargets.length === 0) return showToast('اختر صديقاً', 'error');

            const senderIdentity = getEffectiveSenderIdentity();
            isSendingPulse = true;

            let sentCount = 0;
            let failedTargets = [];

            const processNext = (index) => {
                if (index >= cleanTargets.length) {
                    isSendingPulse = false;
                    localStorage.setItem('feely_sent_pulses', JSON.stringify(sentPulses));
                    renderFriendsManagePage();
                    if (activeTab === 'sent') renderPulsesList();

                    if (sentCount > 0) {
                        const heartsCount = Math.max(4, Math.round(Number(score) / 5));
                        triggerFloatingHearts(heartsCount);
                        playHeartbeatSound();
                        if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                        showToast(`تم الإرسال (${score}%)`);
                    }
                    if (failedTargets.length > 0 && sentCount === 0) {
                        showToast(`(${failedTargets.join(', ')}) غير موجود`, 'error');
                    }
                    return;
                }

                const target = cleanTargets[index];
                db.ref('handles/' + target).once('value', snapshot => {
                    if (!snapshot.exists()) {
                        failedTargets.push(target);
                        processNext(index + 1);
                        return;
                    }

                    const pulseData = {
                        target: target,
                        sender: senderIdentity.name,
                        senderHandle: senderIdentity.handle,
                        score: score,
                        note: note,
                        timestamp: Date.now()
                    };

                    db.ref('pulses/' + target).push(pulseData).then(() => {
                        sentCount += 1;
                        db.ref('stats/' + target + '/receivedCount').transaction(curr => (curr || 0) + 1);

                        if (hiddenFriends.includes(target)) {
                            hiddenFriends = hiddenFriends.filter(f => f !== target);
                            localStorage.setItem('feely_hidden_friends', JSON.stringify(hiddenFriends));
                        }

                        sentPulses.unshift(pulseData);

                        if (userHandle) {
                            recordTargetStreakInCloud(userHandle, target);
                        }

                        processNext(index + 1);
                    }).catch(() => {
                        failedTargets.push(target);
                        processNext(index + 1);
                    });
                });
            };

            processNext(0);
        }

        function listenForIncomingPulses(handle) {
            db.ref('pulses/' + handle).on('value', (snapshot) => {
                const previousCount = incomingPulses.length;
                incomingPulses = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => incomingPulses.unshift(data[key]));
                    if (!isFirstPulseLoad && incomingPulses.length > previousCount) {
                        const newAdditions = incomingPulses.length - previousCount;
                        unreadPulsesCount += newAdditions;
                        updateBellBadgeState();

                        showLocalNotification(incomingPulses[0]);
                        triggerFloatingHearts(20);
                        playHeartbeatSound();
                        showToast(`نبضة جديدة (${incomingPulses[0].score}%) من ${incomingPulses[0].sender}`);
                    }
                }
                isFirstPulseLoad = false;
                
                const totalCount = incomingPulses.length;
                const countBadge = document.getElementById('totalHeartsReceivedBadge');
                const miniBadge = document.getElementById('miniHeartsBadge');
                const tabBadge = document.getElementById('incomingTabCountBadge');

                if (countBadge) countBadge.innerHTML = `${ICONS.heartMed} <span>${totalCount}</span>`;
                if (miniBadge) miniBadge.innerHTML = `${ICONS.heartFill} <span>${totalCount}</span>`;
                if (tabBadge) tabBadge.textContent = totalCount;

                db.ref('stats/' + handle + '/receivedCount').set(totalCount);

                if (activeTab === 'incoming') renderPulsesList();
            });
        }

        function initPushNotifications(handle) {
            if ("Notification" in window && messaging && Notification.permission === 'granted' && 'serviceWorker' in navigator) {
                navigator.serviceWorker.register('/firebase-messaging-sw.js').then((registration) => {
                    return messaging.getToken({ serviceWorkerRegistration: registration, vapidKey: 'BD8T3W-78T3W-EXAMPLE-VAPID-KEY' });
                }).then((currentToken) => {
                    if (currentToken) db.ref('fcmTokens/' + handle).set(currentToken);
                }).catch(err => console.log('ملاحظة: يتطلب HTTPS والمفتاح الصحيح.', err));
            }
        }

        function showLocalNotification(pulse) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Feely", {
                    body: `${pulse.sender} (${pulse.score}%)` + (pulse.note ? ` · ${pulse.note}` : ''),
                    icon: "https://cdn-icons-png.flaticon.com/512/2589/2589175.png"
                });
            }
        }

        // ================= CONSISTENT PULSES LIST WITH EXACT DATE & TIME =================
        function renderPulsesList() {
            const list = document.getElementById('pulsesList');
            list.innerHTML = '';

            const currentData = activeTab === 'incoming' ? incomingPulses : sentPulses;

            if (currentData.length === 0) {
                list.innerHTML = `
                    <div class="rounded-2xl border border-dashed border-[#d8cbb9] bg-[#efe7dc] py-7 px-4 text-center">
                        <p id="authNotice" class="text-xs text-stone-500 font-medium">لا توجد نبضات</p>
                    </div>
                `;
                return;
            }

            currentData.forEach(item => {
                const exactDateTime = formatExactDateTime(item.timestamp);
                const isIncoming = activeTab === 'incoming';
                const targetOrSender = isIncoming ? (item.senderHandle || item.sender) : item.target;
                const isAnonSender = targetOrSender === 'مجهول';

                const currentStreakVal = activeStreaksCache[targetOrSender] || 0;
                const streakBadge = currentStreakVal > 0 && !isAnonSender
                    ? `<span class="inline-flex items-center gap-0.5 text-[10px] bg-[#f5efe6] border border-[#dfd3c3] text-[#9f1239] font-black px-2 py-0.5 rounded-full tabular-nums">${ICONS.heartSmall} <span>${currentStreakVal}</span></span>` 
                    : '';

                const directionLabel = isIncoming ? 'من' : 'إلى';
                const avatarHTML = isAnonSender
                    ? `<div class="size-10 rounded-full bg-[#f5efe6] border border-[#dfd3c3] flex items-center justify-center shrink-0">${ICONS.incognitoIcon}</div>`
                    : `<div class="story-ring shrink-0">
                           <div class="size-9 rounded-full bg-[#f5efe6] flex items-center justify-center font-mono text-xs font-black text-slate-900">
                               ${targetOrSender.charAt(0)}
                           </div>
                       </div>`;

                const noteBlockHTML = item.note
                    ? `<div class="mt-2 rounded-xl bg-[#f5efe6] border border-[#dfd3c3] px-3 py-2 text-xs text-slate-700 leading-relaxed break-words">
                           ${item.note}
                       </div>`
                    : '';

                const pulseCard = document.createElement('div');
                pulseCard.className = "pulse-item-card p-3.5 text-right cursor-pointer active:scale-[0.99]";
                pulseCard.onclick = () => {
                    if (!isAnonSender) {
                        setDefaultRecipient(targetOrSender);
                    }
                    if (isIncoming) {
                        triggerFloatingHearts(10);
                        playHeartbeatSound();
                        if (unreadPulsesCount > 0) {
                            unreadPulsesCount = 0;
                            updateBellBadgeState();
                        }
                    }
                };
                pulseCard.innerHTML = `
                    <div class="flex items-center justify-between gap-2.5">
                        <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-[11px] font-black text-[#9f1239] bg-[#f5efe6] border border-[#dfd3c3] shrink-0 tabular-nums">
                            ${ICONS.heartSmall}
                            <span>${item.score}%</span>
                        </span>

                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="min-w-0 text-right">
                                <div class="flex items-center justify-end gap-1.5">
                                    ${streakBadge}
                                    <span class="font-mono text-xs font-black text-slate-900 uppercase truncate">${isIncoming ? item.sender : item.target}</span>
                                    <span class="text-[10px] font-bold text-stone-500">${directionLabel}</span>
                                </div>
                                <p class="text-[9px] text-stone-500 font-medium mt-0.5 tabular-nums tracking-tight">${exactDateTime}</p>
                            </div>
                            ${avatarHTML}
                        </div>
                    </div>
                    ${noteBlockHTML}
                `;
                list.appendChild(pulseCard);
            });
        }
    </script>
</body>

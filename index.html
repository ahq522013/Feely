<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FBF8F5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Feely">
    <title>Feely</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            font-family: 'Readex Pro', sans-serif;
            background-color: #FBF8F5;
            background-image: none;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            padding-top: var(--safe-top);
            padding-bottom: calc(1.75rem + var(--safe-bottom));
        }

        /* Pure Beige Cards */
        .glass-card {
            background: #f5efe6;
            border-radius: 30px;
            box-shadow: 0 10px 26px -14px rgba(159, 18, 57, 0.12), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            border: 1px solid #e7ddd0;
        }

        .soft-input {
            background: #ffffff;
            border: 1.5px solid #dfd3c3;
            color: #1e293b;
            border-radius: 18px;
            font-size: 16px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .soft-input:focus {
            border-color: #b91c3c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(185, 28, 60, 0.12);
        }

        /* Compact Beige Box Inputs */
        .white-compact-box {
            background: #fbf8f5;
            border: 1.5px solid #dfd3c3;
            border-radius: 16px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .white-compact-box:focus-within {
            border-color: #b91c3c;
            background: #f7f2ea;
            box-shadow: 0 0 0 3px rgba(185, 28, 60, 0.12);
        }

        /* Unified Right-Aligned Small Field Typography */
        .unified-field-text {
            font-family: 'Readex Pro', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            color: #334155;
        }
        .unified-field-text::placeholder {
            font-family: 'Readex Pro', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: normal;
            color: #8c8275;
        }

        /* Story Avatar Ring (Deep Crimson Tone for Profile/Manage) */
        .story-ring {
            background: linear-gradient(135deg, #b91c3c 0%, #881337 100%);
            padding: 2.5px;
            border-radius: 9999px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Neutral Avatar Ring for Pulse Cards */
        .pulse-neutral-ring {
            background: #dfd3c3;
            padding: 2px;
            border-radius: 9999px;
        }

        /* Heart Score Tooltip */
        .heart-tooltip-host {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .heart-score-tip {
            position: absolute;
            bottom: calc(100% + 5px);
            left: 50%;
            transform: translateX(-50%) translateY(3px) scale(0.92);
            opacity: 0;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.88);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            line-height: 1;
            padding: 3px 6px;
            border-radius: 9999px;
            white-space: nowrap;
            z-index: 60;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .heart-tooltip-host:hover .heart-score-tip,
        .heart-tooltip-host.tip-visible .heart-score-tip {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* Subtle Social Delivery Status Pill */
        @keyframes statusFadeIn {
            0% { opacity: 0; transform: translateY(3px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .status-pill-fade {
            animation: statusFadeIn 0.2s ease forwards;
        }

        /* Fresh Incoming Pulse Highlight */
        @keyframes freshPulseGlow {
            0% { border-color: #9f1239; box-shadow: 0 0 0 3px rgba(159, 18, 57, 0.14); }
            100% { border-color: #dfd3c3; box-shadow: 0 4px 12px -6px rgba(159, 18, 57, 0.08); }
        }
        .pulse-fresh-arrive {
            animation: freshPulseGlow 1.6s ease-out forwards;
        }

        /* Social Pulse Item Cards */
        .pulse-item-card {
            background: #fbf8f5;
            border: 1.5px solid #dfd3c3;
            border-radius: 20px;
            box-shadow: 0 4px 12px -6px rgba(159, 18, 57, 0.08);
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .pulse-item-card:hover {
            border-color: #cbbba6;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px -8px rgba(159, 18, 57, 0.12);
        }

        /* Heart Send Button & Circular Progress Ring */
        @keyframes heartHalo {
            0% { box-shadow: 0 0 0 0 rgba(159, 18, 57, 0.25); }
            70% { box-shadow: 0 0 0 14px rgba(159, 18, 57, 0); }
            100% { box-shadow: 0 0 0 0 rgba(159, 18, 57, 0); }
        }
        .heart-send-btn {
            animation: heartHalo 2.2s infinite;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .heart-charging {
            animation: none !important;
            box-shadow: 0 0 0 12px rgba(159, 18, 57, 0.14), 0 12px 28px -6px rgba(136, 19, 55, 0.35);
            transform: scale(1.05);
        }

        /* Floating Hearts Animation */
        @keyframes floatHeartUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            60% { opacity: 0.95; }
            100% { transform: translateY(-88dvh) scale(1.4) rotate(var(--rot, 20deg)); opacity: 0; }
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            z-index: 9999;
            animation: floatHeartUp var(--dur, 2.4s) cubic-bezier(0.22, 1, 0.36, 1) forwards;
            user-select: none;
        }

        /* Unified Centered Toast Notification */
        @keyframes toastCenterDrop {
            0% { transform: translateY(-24px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .toast-enter {
            animation: toastCenterDrop 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Small Mini Pill next to Incognito Button */
        @keyframes miniPillPop {
            0% { opacity: 0; transform: translateX(6px) scale(0.94); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .mini-pill-pop {
            animation: miniPillPop 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes sheetPopIn {
            0% { opacity: 0; transform: translateY(16px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .sheet-pop-in {
            animation: sheetPopIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .smooth-scroll-list {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scroll-behavior: smooth;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dfd3c3; border-radius: 10px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body class="text-slate-800 min-h-[100dvh] flex flex-col justify-between antialiased selection:bg-rose-900/15 selection:text-rose-900">

    <!-- عداد شفاف ~50% يظهر فوق مكان ضغط الإصبع أثناء الشحن ويختفي عند الإفلات -->
    <div id="fingerChargeCounter"
         style="left: 0px; top: 0px; transform: translate(-50%, -145%) scale(0.88);"
         class="fixed z-[9998] opacity-0 pointer-events-none transition-opacity duration-150 px-3.5 py-1 rounded-full bg-slate-900/50 backdrop-blur-sm border border-white/25 shadow-md flex items-center gap-1.5">
        <span class="size-1.5 rounded-full bg-rose-400"></span>
        <span id="rangeDisplay" class="text-xs font-black text-white/95 tabular-nums tracking-tight">0%</span>
    </div>

    <!-- حاوية الإشعارات الموحدة في منتصف الشاشة -->
    <div id="toastContainer" style="top: calc(1rem + var(--safe-top));" class="fixed inset-x-0 mx-auto z-[9999] pointer-events-none px-4 flex flex-col items-center justify-center w-full max-w-sm"></div>

    <!-- Header العلوي الموحد -->
    <header class="w-full max-w-md mx-auto px-3.5 sm:px-5 pt-4 sm:pt-6 flex justify-between items-center gap-1.5">
        <div id="authStatusContainer" class="flex items-center gap-1 sm:gap-1.5 flex-wrap">
            <!-- أيقونة حفظ الحساب / خروج -->
            <button id="openAuthModalBtn" onclick="openAuthModal()" title="حفظ الحساب"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] hover:bg-[#fbf8f5] text-slate-700 border border-[#dfd3c3] transition shadow-2xs active:scale-95">
                <svg class="w-4 h-4 text-[#9f1239]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
            </button>
            <button id="logoutBtn" onclick="logout()" title="خروج"
                    class="hidden grid size-8 sm:size-9 place-items-center rounded-full bg-[#fbf8f5] hover:bg-[#e5dacb] text-[#9f1239] border border-[#dfd3c3] transition active:scale-95">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>

            <!-- زر النبض (الرئيسية) -->
            <button type="button" id="navHomeBtn" onclick="switchMainView('home')" title="النبض"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#9f1239] text-white shadow-sm shadow-rose-900/20 transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
            </button>

            <!-- زر صفحة أصدقاء النبض المستقلة -->
            <button type="button" id="navFriendsBtn" onclick="switchMainView('friends')" title="أصدقاء النبض"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] border border-[#dfd3c3] shadow-2xs transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </button>

            <!-- زر عدسة البحث -->
            <button type="button" id="navSearchBtn" onclick="switchMainView('search')" title="بحث"
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] border border-[#dfd3c3] shadow-2xs transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>

            <!-- زر البروفايل الشخصي -->
            <button type="button" id="navProfileBtn" onclick="switchMainView('profile')" title="ملفي"
                    class="relative grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] border border-[#dfd3c3] shadow-2xs transition-all active:scale-90">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span id="profileAlertDot" class="hidden absolute right-1.5 top-1.5 size-2 rounded-full bg-[#9f1239] ring-2 ring-[#f5efe6]"></span>
            </button>

            <!-- أيقونة الإشعارات -->
            <button id="notificationBellBtn" onclick="handleBellClick()" title="الإشعارات" 
                    class="relative grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] transition border border-[#dfd3c3] shadow-2xs active:scale-90">
                <svg id="bellSvgIcon" class="w-4 h-4 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
                <span id="bellBadge" class="hidden absolute right-1.5 top-1.5 flex size-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-500 opacity-75"></span>
                    <span class="relative inline-flex rounded-full size-2.5 bg-[#9f1239] ring-2 ring-[#f5efe6]"></span>
                </span>
            </button>

            <!-- زر نغمة النبض -->
            <button id="soundToggleBtn" onclick="toggleSoundEffect()" title="الصوت" 
                    class="grid size-8 sm:size-9 place-items-center rounded-full bg-[#f5efe6] text-slate-600 hover:text-[#9f1239] transition border border-[#dfd3c3] shadow-2xs active:scale-90">
                <span id="soundIcon" class="flex items-center justify-center"></span>
            </button>
        </div>

        <!-- الشعار -->
        <div onclick="switchMainView('home')" class="flex items-center gap-2 cursor-pointer select-none group shrink-0">
            <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight leading-none">Feely</h1>
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-2xl bg-gradient-to-tr from-[#881337] via-[#9f1239] to-[#be123c] flex items-center justify-center text-white shadow-md shadow-rose-900/20 group-active:scale-95 transition">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-white" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-md mx-auto px-3.5 sm:px-4 py-4 flex-grow">

        <!-- ==================== VIEW 1: HOME ==================== -->
        <div id="viewHome" class="space-y-3.5">

            <!-- بطاقة الهوية المصغرة في الأعلى -->
            <div onclick="switchMainView('profile')" class="glass-card px-4 py-3 flex items-center justify-between cursor-pointer hover:border-[#b91c3c] transition active:scale-[0.99]">
                <span class="inline-flex items-center gap-1.5 text-xs font-black text-[#9f1239] bg-[#fbf8f5] border border-[#dfd3c3] px-3 py-1 rounded-full tabular-nums" id="miniHeartsBadge">
                    <svg class="w-3.5 h-3.5 fill-[#9f1239]" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span>0</span>
                </span>
                <div class="flex items-center gap-2 min-w-0">
                    <span id="miniHandleDisplay" class="unified-field-text uppercase truncate">فعّل رمزك</span>
                    <div class="size-7 rounded-full bg-[#fbf8f5] border border-[#dfd3c3] text-[#9f1239] flex items-center justify-center shrink-0">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- بطاقة صفحة الصديق (عند فتح رابط مباشر ?u=...) -->
            <section id="friendProfileCard" class="hidden glass-card p-4 sm:p-5 relative overflow-hidden space-y-3 border-2 border-[#b91c3c]">
                <div class="flex items-center justify-between">
                    <button type="button" onclick="closeFriendProfile()" class="grid size-7 place-items-center text-slate-600 hover:text-slate-900 bg-[#fbf8f5] rounded-full border border-[#dfd3c3] transition active:scale-95">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                    <span id="friendProfileStreakText" class="inline-flex items-center gap-1 text-xs font-black text-[#9f1239] tabular-nums">
                        <svg class="w-3.5 h-3.5 fill-[#9f1239]" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>0</span>
                    </span>
                </div>

                <div class="flex items-center justify-between gap-2 bg-[#fbf8f5] rounded-2xl px-3.5 py-3 border border-[#dfd3c3]">
                    <span class="inline-flex items-center gap-1.5 text-xs font-black text-[#9f1239] bg-[#f5efe6] border border-[#dfd3c3] px-3 py-1.5 rounded-full shrink-0 tabular-nums" id="friendHeartsReceivedBadge">
                        <svg class="w-3.5 h-3.5 fill-[#9f1239]" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>0</span>
                    </span>

                    <div class="flex items-center gap-2 min-w-0">
                        <span id="friendProfileHandle" class="font-mono text-xl font-black tracking-[0.22em] text-slate-900 uppercase truncate">---</span>
                        <button type="button" onclick="copyFriendLink()" title="نسخ"
                                class="p-1.5 text-slate-600 hover:text-[#9f1239] hover:bg-[#f5efe6] rounded-xl transition active:scale-90 shrink-0">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- بطاقة إرسال النبضة -->
            <section class="glass-card p-5 sm:p-6 space-y-3 relative">
                <!-- أيقونة التصفح الخفي وبوكس تنبيه صغير متناسق بجانبها -->
                <div class="absolute top-4 right-4 z-10 flex items-center gap-1.5">
                    <button type="button" id="anonymousToggleBtn" onclick="toggleAnonymousMode()" title="التصفح الخفي"
                            class="grid size-8 place-items-center rounded-full bg-[#fbf8f5] text-slate-600 border border-[#dfd3c3] hover:border-[#b91c3c] transition-all active:scale-90 shrink-0">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 11h18"/>
                            <path d="M5 11l2-6c.3-.9 1.1-1.5 2-1.5h6c.9 0 1.7.6 2 1.5l2 6"/>
                            <circle cx="7.5" cy="16.5" r="2.5"/>
                            <circle cx="16.5" cy="16.5" r="2.5"/>
                            <path d="M10 16.5h4"/>
                        </svg>
                    </button>

                    <div id="anonMiniPill" class="hidden mini-pill-pop px-2.5 py-1 rounded-full bg-[#fbf8f5] border border-[#dfd3c3] shadow-2xs">
                        <span id="anonMiniPillText" class="text-[10px] font-bold text-[#9f1239] leading-none">تفعيل وضع التخفي</span>

        // ================= DELETE PULSE FROM HISTORY =================
        function deletePulseFromHistory(e, isIncoming, index, firebaseKey) {
            if (e) e.stopPropagation();
            if (isIncoming) {
                const targetItem = incomingPulses[index];
                if (!targetItem) return;
                const keyToRemove = firebaseKey || targetItem._fbKey;
                if (keyToRemove && userHandle) {
                    db.ref('pulses/' + userHandle + '/' + keyToRemove).remove().catch(() => {
                        if (!dismissedIncomingKeys.includes(keyToRemove)) {
                            dismissedIncomingKeys.push(keyToRemove);
                            localStorage.setItem('feely_dismissed_incoming', JSON.stringify(dismissedIncomingKeys));
                        }
                    });
                }
                incomingPulses.splice(index, 1);
                const tabBadge = document.getElementById('incomingTabCountBadge');
                if (tabBadge) tabBadge.textContent = incomingPulses.length;
            } else {
                sentPulses.splice(index, 1);
                localStorage.setItem('feely_sent_pulses', JSON.stringify(sentPulses));
            }
            if (navigator.vibrate) navigator.vibrate(10);
            renderPulsesList();
        }

            document.querySelectorAll('.heart-tooltip-host.tip-visible').forEach(node => {

            el._tipTimer = setTimeout(() => {
                el.classList.remove('tip-visible');
            }, 1400);

        // ================= ACCURATE HEART AREA FILL WITH TOOLTIP =================
        function buildAccurateHeartFill(score, uid, sizeClass = 'w-4 h-4') {
            const clamped = Math.max(0, Math.min(100, Number(score) || 0));
            const heartPath = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
            const heartBottom = 21.35;
            const heartSpan = 18.35;
            const fillRatio = clamped / 100;
            const filledHeight = +(heartSpan * fillRatio).toFixed(3);
            const filledTopY = +(heartBottom - filledHeight).toFixed(3);
            const clipId = `heartAreaClip_${uid}`;

            return `
                <div onclick="showHeartScoreTip(this, event)"
                     title="${clamped}%"
                     class="heart-tooltip-host shrink-0 cursor-pointer select-none p-1">
                    <span class="heart-score-tip tabular-nums">${clamped}%</span>
                    <svg class="${sizeClass} shrink-0" viewBox="0 0 24 24">
                        <defs>
                            <clipPath id="${clipId}">
                                <rect x="2" y="${filledTopY}" width="20" height="${filledHeight}" />
                            </clipPath>
                        </defs>
                        <path d="${heartPath}" fill="none" stroke="#9f1239" stroke-width="1.85" stroke-linejoin="round" />
                        <path d="${heartPath}" fill="#9f1239" clip-path="url(#${clipId})" />
                    </svg>
                </div>
            `;
        }

        // ================= ORDERED FRIENDS LIST (PINNED + RECENT OR STREAK) =================
        function getOrderedFriendsList() {
            const sentTargets = sentPulses.map(p => (p.target || '').toUpperCase()).filter(Boolean);
            const pinnedUpper = pinnedFriends.map(h => h.toUpperCase());
            const combined = [...new Set([...sentTargets, ...pinnedUpper])].filter(h => !hiddenFriends.includes(h));

            const sortedRest = combined.filter(h => !favoriteFriends.includes(h));
            if (friendsSortMode === 'streak') {
                sortedRest.sort((a, b) => (activeStreaksCache[b] || 0) - (activeStreaksCache[a] || 0));
            }

            const favs = favoriteFriends.filter(h => combined.includes(h));
            return [...favs, ...sortedRest];
        }

        function toggleFriendsSortMode() {
            friendsSortMode = friendsSortMode === 'recent' ? 'streak' : 'recent';
            localStorage.setItem('feely_friends_sort', friendsSortMode);
            const btn = document.getElementById('friendsSortToggleBtn');
            if (btn) {
                btn.textContent = friendsSortMode === 'streak' ? 'الترتيب: الستريك' : 'الترتيب: الأحدث';
            }
            renderFriendsManagePage();

        function togglePinFriend(e, handle) {
            if (e) e.stopPropagation();
            const clean = handle.trim().toUpperCase();
            if (favoriteFriends.includes(clean)) {
                favoriteFriends = favoriteFriends.filter(f => f !== clean);
            } else {
                favoriteFriends.unshift(clean);
            }
            localStorage.setItem('feely_favorite_friends', JSON.stringify(favoriteFriends));
            renderFriendsManagePage();
            renderSheetFriendsList();
        }

        function updateStreakReminderBanner(friends) {
            const banner = document.getElementById('streakReminderBanner');
            const textEl = document.getElementById('streakReminderText');
            if (!banner || !textEl) return;

            const todayStr = new Date().toDateString();
            const pendingStreakFriends = friends.filter(h => {
                const st = activeStreaksCache[h] || 0;
                const lastD = streakDatesCache[h] || '';
                return st > 0 && lastD !== todayStr;
            });

            if (pendingStreakFriends.length > 0) {
                textEl.textContent = `ستريك نشط بانتظار اليوم (${pendingStreakFriends.slice(0, 2).join(' · ')})`;
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        // ================= FORMAT EXACT DATE & TIME =================
        function formatExactDateTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const timeStr = d.toLocaleTimeString('ar-SA', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year} · ${timeStr}`;
        }

        function updateBellBadgeState() {
            const bellBadge = document.getElementById('bellBadge');
            const bellBtn = document.getElementById('notificationBellBtn');

            if (unreadPulsesCount > 0) {
                bellBadge.classList.remove('hidden');

                bellBtn.classList.remove('text-slate-600', 'bg-[#f5efe6]');
            } else {
                bellBadge.classList.add('hidden');
                bellBtn.classList.remove('text-[#9f1239]', 'border-[#b91c3c]', 'bg-[#fbf8f5]');
                bellBtn.classList.add('text-slate-600', 'bg-[#f5efe6]');
            }
        }

        function handleBellClick() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted" && userHandle) {
                        initPushNotifications(userHandle);
                    }
                });
            }

            if (unreadPulsesCount > 0) {
                unreadPulsesCount = 0;
                updateBellBadgeState();
                switchMainView('home');
                switchPulseTab('incoming');
                const feedSection = document.getElementById('pulsesFeedSection');
                if (feedSection) {
                    feedSection.scrollIntoView({ behavior: 'smooth', block: 'center' });

            } else {
                showToast('لا توجد إشعارات جديدة');

        // ================= ADD / REMOVE FRIENDS IN DEDICATED PAGE =================
        function confirmAddRecipient() {
            const input = document.getElementById('targetIdInput');
            const code = input.value.trim().toUpperCase();
            if (!code) {
                input.focus();
                return showToast('أضف رمز صديق', 'error');
            }

            db.ref('handles/' + code).once('value', snapshot => {
                if (!snapshot.exists()) {
                    return showToast(`(${code}) غير موجود`, 'error');
                }

                if (hiddenFriends.includes(code)) {
                    hiddenFriends = hiddenFriends.filter(f => f !== code);
                    localStorage.setItem('feely_hidden_friends', JSON.stringify(hiddenFriends));
                }

                if (!pinnedFriends.includes(code)) {
                    pinnedFriends.unshift(code);
                    localStorage.setItem('feely_pinned_friends', JSON.stringify(pinnedFriends));
                }

                input.value = '';
                renderFriendsManagePage();
                checkTargetStreak(code);
                if (navigator.vibrate) navigator.vibrate(15);
                showToast(`تمت إضافة (${code})`);
            });
        }

        function removeFriendFromManage(e, handle) {
            e.stopPropagation();
            const clean = handle.trim().toUpperCase();

            pinnedFriends = pinnedFriends.filter(f => f !== clean);
            favoriteFriends = favoriteFriends.filter(f => f !== clean);
            localStorage.setItem('feely_pinned_friends', JSON.stringify(pinnedFriends));
            localStorage.setItem('feely_favorite_friends', JSON.stringify(favoriteFriends));

            if (!hiddenFriends.includes(clean)) {
                hiddenFriends.push(clean);
                localStorage.setItem('feely_hidden_friends', JSON.stringify(hiddenFriends));
            }

            const targetInput = document.getElementById('targetIdInput');
            if (targetInput && targetInput.value.trim().toUpperCase() === clean) {
                targetInput.value = '';
            }

            renderFriendsManagePage();
            if (navigator.vibrate) navigator.vibrate(12);
        }

            localStorage.setItem('feely_pinned_friends', JSON.stringify(pinnedFriends));

        function positionFingerCounter(clientX, clientY) {

            if (!counter) return;
            counter.style.left = clientX + 'px';
            counter.style.top = clientY + 'px';
        }

        function setFingerCounterVisible(visible) {
            const counter = document.getElementById('fingerChargeCounter');
            if (!counter) return;
            if (visible) {
                counter.classList.remove('opacity-0');
                counter.classList.add('opacity-100');
                counter.style.transform = 'translate(-50%, -155%) scale(1)';

        function updateLoveMeterUI(val) {
            const clamped = Math.max(0, Math.min(100, Math.round(val)));
            currentLoveValue = clamped;
            document.getElementById('rangeDisplay').textContent = clamped + '%';

            const svg = document.getElementById('dynamicHeartSvg');
            if (svg) {
                const scale = 0.68 + (clamped / 100) * 0.74;
                svg.style.transform = `scale(${scale.toFixed(3)})`;
            }

            const ring = document.getElementById('circularChargeRing');
            if (ring) {
                const offset = RING_CIRCUMFERENCE * (1 - clamped / 100);
                ring.style.strokeDashoffset = offset.toFixed(2);
            }
        }

        function handleGlobalPointerMove(e) {
            if (!isChargingHeart) return;
            positionFingerCounter(e.clientX, e.clientY);
        }

        function handleGlobalPointerUp() {
            if (!isChargingHeart) return;
            finishHeartChargeAndOpenSheet();
        }

        function attachGlobalChargeListeners() {
            window.addEventListener('pointermove', handleGlobalPointerMove, { passive: true });
            window.addEventListener('pointerup', handleGlobalPointerUp);
            window.addEventListener('pointercancel', handleGlobalPointerUp);
        }

        function detachGlobalChargeListeners() {
            window.removeEventListener('pointermove', handleGlobalPointerMove);
            window.removeEventListener('pointerup', handleGlobalPointerUp);
            window.removeEventListener('pointercancel', handleGlobalPointerUp);
        }

        function startHeartCharge(e) {
            if (e) e.preventDefault();
            if (isSendingPulse || isChargingHeart) return;

            isChargingHeart = true;
            const orb = document.getElementById('mainHeartOrb');
            if (orb) orb.classList.add('heart-charging');

            let val = 0;
            updateLoveMeterUI(val);
            if (typeof e.clientX === 'number' && typeof e.clientY === 'number') {
                positionFingerCounter(e.clientX, e.clientY);
            }
            setFingerCounterVisible(true);
            attachGlobalChargeListeners();
            if (navigator.vibrate) navigator.vibrate(12);

            chargeDelayTimer = setTimeout(() => {
                if (!isChargingHeart) return;

                const tick = () => {
                    if (!isChargingHeart || val >= 100) return;
                    val += 1;
                    updateLoveMeterUI(val);

                    if ([25, 50, 75, 100].includes(val) && navigator.vibrate) {
                        navigator.vibrate(val === 100 ? [30, 40, 30] : 15);
                    }

                    const progress = val / 100;
                    const nextDelay = Math.max(8, Math.round(40 * Math.pow(1 - progress, 1.45)));
                    chargeStepTimer = setTimeout(tick, nextDelay);
                };

                tick();
            }, 220);
        }

        function finishHeartChargeAndOpenSheet() {
            if (!isChargingHeart) return;

            clearTimeout(chargeDelayTimer);
            clearTimeout(chargeStepTimer);
            chargeDelayTimer = null;
            chargeStepTimer = null;
            isChargingHeart = false;
            detachGlobalChargeListeners();

            const orb = document.getElementById('mainHeartOrb');
            if (orb) orb.classList.remove('heart-charging');
            setFingerCounterVisible(false);

            const selectedScore = currentLoveValue;
            setTimeout(() => {
                if (!isChargingHeart) updateLoveMeterUI(0);
            }, 250);

            openSendPulseSheet(selectedScore);
        }

                document.getElementById('searchResultBox').classList.add('hidden');

            if (!rawCode) return;
            performFriendLookup(rawCode, true);

        function performFriendLookup(rawCode, saveToHistory = true) {
            const resultBox = document.getElementById('searchResultBox');
            const errBox = document.getElementById('searchErrorMsg');

            errBox.classList.add('hidden');

            db.ref('handles/' + rawCode).once('value', snapshot => {
                if (!snapshot.exists()) {
                    resultBox.classList.add('hidden');
                    errBox.textContent = `(${rawCode}) غير موجود`;
                    errBox.classList.remove('hidden');
                    return;
                }

                if (saveToHistory) {
                    recentSearches = [rawCode, ...recentSearches.filter(c => c !== rawCode)].slice(0, 5);
                    localStorage.setItem('feely_recent_searches', JSON.stringify(recentSearches));
                    renderRecentSearches();
                }

                document.getElementById('searchResultHandle').textContent = rawCode;
                document.getElementById('searchResultAvatar').textContent = rawCode.charAt(0);
                resultBox.classList.remove('hidden');

                db.ref('stats/' + rawCode + '/receivedCount').once('value', countSnap => {
                    const count = countSnap.val() || 0;
                    document.getElementById('searchResultHearts').innerHTML = `${ICONS.heartFill} <span>${count}</span>`;
                });

                checkTargetStreak(rawCode, (streakVal) => {
                    document.getElementById('searchResultStreak').innerHTML = `${ICONS.heartSmall} <span>${streakVal}</span>`;
                });

                document.getElementById('searchSendPulseBtn').onclick = () => {
                    setDefaultRecipient(rawCode);
                    switchMainView('home');
                };

                document.getElementById('searchCopyLinkBtn').onclick = () => {
                    const link = window.location.origin + window.location.pathname + '?u=' + rawCode;
                    navigator.clipboard.writeText(link);
                    showToast(`تم النسخ (${rawCode})`);
                };
            });
        }

        function renderRecentSearches() {
            const section = document.getElementById('recentSearchesSection');
            const list = document.getElementById('recentSearchesList');
            if (!section || !list) return;

            if (recentSearches.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            list.innerHTML = '';
            recentSearches.forEach(code => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => {
                    document.getElementById('searchFriendInput').value = code;
                    performFriendLookup(code, false);
                };
                btn.className = "font-mono text-xs font-bold text-slate-700 bg-[#fbf8f5] hover:bg-[#e5dacb] border border-[#dfd3c3] px-3 py-1 rounded-full transition active:scale-95";
                btn.textContent = code;
                list.appendChild(btn);
            });
        }

        // ================= FRIEND PROFILE PAGE LOGIC (ONLY FOR DIRECT URL ?u=...) =================
        function openFriendProfile(handle) {
            const cleanHandle = handle.trim().toUpperCase();
            if (!cleanHandle) return;

            db.ref('handles/' + cleanHandle).once('value', snapshot => {
                if (!snapshot.exists()) {
                    return showToast(`(${cleanHandle}) غير موجود`, 'error');
                }

                if (friendStatsListenerRef) {
                    friendStatsListenerRef.off();
                }

        function playHeartbeatSound() {
            if (!isSoundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();

                if (ctx.state === 'suspended') {
                    ctx.resume().then(() => {
                        runHeartbeatBeats(ctx);
                    }).catch(() => {
                        pendingSoundOnFirstGesture = true;
                    });
                    return;
                }

                runHeartbeatBeats(ctx);
            } catch (e) {
                pendingSoundOnFirstGesture = true;
            }
        }

        function runHeartbeatBeats(ctx) {
            const beat = (delay, freq, duration) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
                osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + delay + duration);

                gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + delay + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + delay);
                osc.stop(ctx.currentTime + delay + duration + 0.02);
            };

            beat(0, 125, 0.16);
            beat(0.20, 105, 0.22);
        }

        function triggerFloatingHearts(count = 16) {
            const colors = ['#9f1239', '#be123c', '#881337', '#b91c3c'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const heart = document.createElement('span');
                    heart.className = 'floating-heart';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = Math.random() * 16 + 16;
                    heart.innerHTML = `<svg style="width:${size}px;height:${size}px;fill:${color};" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                    
                    const leftPos = Math.random() * 86 + 7;
                    const duration = Math.random() * 1.4 + 1.8;
                    const rotation = (Math.random() * 50 - 25) + 'deg';

                    heart.style.left = leftPos + 'vw';
                    heart.style.setProperty('--dur', duration + 's');
                    heart.style.setProperty('--rot', rotation);

                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), duration * 1000 + 100);
                }, i * 50);
            }
        }

        function getFirebasePairKey(handle1, handle2) {
            if (!handle1 || !handle2) return null;
            const h1 = handle1.trim().toUpperCase();
            const h2 = handle2.trim().toUpperCase();
            return [h1, h2].sort().join('_');

        function checkTargetStreak(target, callback) {
            const trimmedTarget = target.trim().toUpperCase();
            const badge = document.getElementById('targetStreakIndicator');
            
            if (trimmedTarget.length < 1 || !userHandle || !currentUser) {
                if (badge) badge.classList.add('hidden');
                if (callback) callback(0);
                return;
            }

            const pairKey = getFirebasePairKey(userHandle, trimmedTarget);
            if (!pairKey) return;

            db.ref('streaks/' + pairKey).once('value', snapshot => {
                const data = snapshot.val() || { streak: 0, lastDate: "" };
                const yesterday = new Date(Date.now() - 86400000).toDateString();
                const today = new Date().toDateString();

                let currentStreak = data.streak || 0;
                if (data.lastDate && data.lastDate !== today && data.lastDate !== yesterday) {
                    currentStreak = 0;
                }

                activeStreaksCache[trimmedTarget] = currentStreak;
                streakDatesCache[trimmedTarget] = data.lastDate || "";
                if (badge && document.getElementById('targetIdInput')?.value.trim().toUpperCase() === trimmedTarget) {
                    badge.innerHTML = `${ICONS.heartSmall} <span>${currentStreak}</span>`;
                    badge.classList.remove('hidden');
                }
                if (callback) callback(currentStreak);
            });
        }

        function recordTargetStreakInCloud(senderHandle, targetHandle) {
            const pairKey = getFirebasePairKey(senderHandle, targetHandle);
            if (!pairKey) return;

            db.ref('streaks/' + pairKey).once('value', snapshot => {
                const data = snapshot.val() || { streak: 0, lastDate: "" };
                const today = new Date().toDateString();
                const yesterday = new Date(Date.now() - 86400000).toDateString();

                let newStreak = data.streak || 0;
                if (data.lastDate === yesterday) {
                    newStreak += 1;
                } else if (data.lastDate === today) {
                    newStreak = newStreak === 0 ? 1 : newStreak;
                } else {
                    newStreak = 1;
                }

                db.ref('streaks/' + pairKey).set({
                    streak: newStreak,
                    lastDate: today,
                    updatedAt: Date.now(),
                    pair: [senderHandle, targetHandle]
                }).then(() => {
                    activeStreaksCache[targetHandle] = newStreak;
                    streakDatesCache[targetHandle] = today;
                    checkTargetStreak(targetHandle);
                    if (activeFriendHandle === targetHandle) {
                        document.getElementById('friendProfileStreakText').innerHTML = `${ICONS.heartFill} <span>${newStreak}</span>`;
                    }
                    renderPulsesList();
                    renderFriendsManagePage();
                });
            });
        }

        function sendPulseToMultipleTargets(targetHandles, score, note, options = {}) {
            if (isSendingPulse) return;
            if (!currentUser) {
                if (options.fromSheet) setSheetDeliveryStatus('جاري الاتصال...', true);
                return;
            }

            const cleanTargets = [...new Set(targetHandles.map(h => h.trim().toUpperCase()).filter(Boolean))];
            if (cleanTargets.length === 0) {
                if (options.fromSheet) setSheetDeliveryStatus('اختر صديقاً', true);
                return;
            }

            const senderIdentity = getEffectiveSenderIdentity();
            isSendingPulse = true;
            if (options.fromSheet) setSheetDeliveryStatus('جاري الإرسال...', false, 0);

            let sentCount = 0;
            let failedTargets = [];

            const processNext = (index) => {
                if (index >= cleanTargets.length) {
                    isSendingPulse = false;
                    localStorage.setItem('feely_sent_pulses', JSON.stringify(sentPulses));
                    renderFriendsManagePage();
                    if (activeTab === 'sent') renderPulsesList();

                    if (sentCount > 0) {
                        const heartsCount = Math.max(4, Math.round(Number(score) / 5));
                        triggerFloatingHearts(heartsCount);
                        playHeartbeatSound();
                        if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                    }
                    if (typeof options.onComplete === 'function') {
                        options.onComplete(sentCount, failedTargets);
                    }
                    return;
                }

                const target = cleanTargets[index];
                db.ref('handles/' + target).once('value', snapshot => {
                    if (!snapshot.exists()) {
                        failedTargets.push(target);
                        processNext(index + 1);
                        return;
                    }

                    const pulseData = {
                        target: target,
                        sender: senderIdentity.name,
                        senderHandle: senderIdentity.handle,
                        score: score,
                        note: note,
                        timestamp: Date.now()
                    };

                    db.ref('pulses/' + target).push(pulseData).then(() => {
                        sentCount += 1;
                        db.ref('stats/' + target + '/receivedCount').transaction(curr => (curr || 0) + 1);

                        if (hiddenFriends.includes(target)) {
                            hiddenFriends = hiddenFriends.filter(f => f !== target);
                            localStorage.setItem('feely_hidden_friends', JSON.stringify(hiddenFriends));
                        }

                        sentPulses.unshift(pulseData);

                        if (userHandle) {
                            recordTargetStreakInCloud(userHandle, target);
                        }

                        processNext(index + 1);
                    }).catch(() => {
                        failedTargets.push(target);
                        processNext(index + 1);
                    });
                });
            };

            processNext(0);
        }

                `;

                const noteBlockHTML = item.note
                    ? `<div class="mt-1.5 rounded-xl bg-[#ffffff] border border-[#e7ddd0] px-2.5 py-1 text-[10px] text-stone-600 leading-snug break-words">
                           ${item.note}
                       </div>`
                    : '';

                const pulseCard = document.createElement('div');
                pulseCard.className = `pulse-item-card p-3 text-right cursor-pointer active:scale-[0.99] ${isFresh ? 'pulse-fresh-arrive' : ''}`;
                pulseCard.onclick = () => {
                    if (!isAnonSender) {
                        setDefaultRecipient(targetOrSender);
                    }
                    if (isIncoming) {
                        triggerFloatingHearts(10);
                        playHeartbeatSound();
                        if (unreadPulsesCount > 0) {
                            unreadPulsesCount = 0;
                            updateBellBadgeState();
                        }
                    }
                };
                pulseCard.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            ${avatarHTML}
                            <div class="min-w-0 text-right">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-[10px] font-bold text-stone-500">${directionLabel}</span>
                                    <span class="font-mono text-[10px] font-black text-stone-700 uppercase truncate">${isIncoming ? item.sender : item.target}</span>
                                    ${streakBadge}
                                    ${statusIndicatorHTML}
                                </div>
                                <p class="text-[10px] text-stone-500 font-medium mt-0.5 tabular-nums tracking-tight">${exactDateTime}</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-1 shrink-0">
                            ${deleteBtnHTML}
                            ${quickReplyBtnHTML}
                            ${buildAccurateHeartFill(item.score, cardKey)}
                        </div>
                    </div>
                    ${noteBlockHTML}
                `;
                list.appendChild(pulseCard);
            });
        }
    </script>
</body>
</html>

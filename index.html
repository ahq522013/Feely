<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feely - أرسل نبضة حب</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Readex Pro', sans-serif; background-color: #fdf8f8; }

        .minimal-card {
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 10px 30px -10px rgba(230, 150, 160, 0.12);
            border: 1px solid rgba(252, 230, 233, 0.8);
        }

        .minimal-input {
            background: #fbf1f2;
            border: 1px solid transparent;
            color: #4a3e3e;
            border-radius: 24px;
            transition: all 0.2s ease;
        }

        .minimal-input:focus {
            border-color: #f49fa9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(244, 159, 169, 0.15);
        }

        /* Custom Soft Slider */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer;
            border-radius: 999px;
            background: #fcedee;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 24px; width: 24px; border-radius: 50%;
            background: #ffffff; border: 4px solid #f43f5e; cursor: pointer;
            -webkit-appearance: none; margin-top: -8px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
            transition: transform 0.1s ease;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #fdf8f8; }
        ::-webkit-scrollbar-thumb { background: #f8c8d0; border-radius: 10px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="w-full max-w-md mx-auto px-6 pt-6 flex justify-between items-center">
        <div id="authStatusContainer" class="flex items-center gap-2">
            <button id="openAuthModalBtn" onclick="openAuthModal()" class="flex items-center gap-1.5 text-xs font-bold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200/80 px-4 py-2 rounded-full transition shadow-xs">
                <span>[➔</span>
                <span>دخول (اختياري)</span>
            </button>
            <button id="logoutBtn" onclick="logout()" class="hidden text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3.5 py-2 rounded-full transition">
                خروج
            </button>

            <button id="notificationBellBtn" onclick="toggleNotificationPermission()" title="الإشعارات" 
                    class="relative grid size-8 place-items-center rounded-full bg-white text-slate-600 hover:bg-slate-50 transition border border-slate-200/60 shadow-xs">
                <span id="bellIcon" class="text-xs">🔔</span>
                <span id="bellBadge" class="hidden absolute right-1 top-1 size-2 rounded-full bg-rose-500"></span>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <h1 class="text-xl font-black text-slate-900 tracking-tight">Feely</h1>
            <div class="w-9 h-9 rounded-full bg-rose-500 flex items-center justify-center text-white text-lg shadow-md shadow-rose-200">
                ❤️
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-md mx-auto px-4 py-6 space-y-4 flex-grow">

        <!-- Receive Code Card (مع أيقونة نسخ واحدة مدمجة) -->
        <section class="minimal-card p-6 relative overflow-hidden space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-black text-rose-500 bg-rose-50 border border-rose-100 px-3 py-1 rounded-full shadow-2xs" id="totalHeartsReceivedBadge">
                    0 ❤️ وصلك
                </span>
                <p class="text-xs font-bold text-slate-400">رمزك الخاص</p>
            </div>

            <!-- الحاوية الموحدة للرمز مع أيقونة النسخ المباشرة -->
            <div class="flex items-center justify-between gap-2 bg-[#fbf1f2] rounded-2xl px-4 py-2 border border-rose-100/60">
                <button type="button" id="copyBtn" onclick="copyMyLink()" title="نسخ الرابط"
                        class="p-2 text-slate-600 hover:text-rose-500 hover:bg-white rounded-xl transition active:scale-90 shadow-2xs">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </button>

                <div class="flex-1 text-center font-mono text-xl font-black tracking-[0.35em] text-slate-900 uppercase">
                    <input type="text" id="usernameInput" 
                           class="bg-transparent text-center font-mono text-xl font-black tracking-[0.35em] text-slate-900 outline-none w-full"
                           placeholder="FEELYOU">
                </div>
            </div>

            <!-- زر الإجراء السفلي -->
            <div class="pt-1">
                <button id="handleActionBtn" onclick="registerHandle()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl text-xs shadow-md transition active:scale-95">
                    حفظ الرمز وتفعيله فوراً
                </button>
            </div>
            <p id="handleStatusAlert" class="text-[10px] text-center hidden font-medium

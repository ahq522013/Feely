<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feely</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Readex Pro', sans-serif; 
        }

        /* خلفية فاتحة ناعمة ومشرقة */
        .light-bg {
            background-color: #fcf8fa;
            background-image: 
                radial-gradient(at 0% 0%, rgba(253, 242, 248, 1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 228, 230, 0.7) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(254, 205, 211, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Light Mode Glass/Card Style */
        .light-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 63, 94, 0.12);
            box-shadow: 0 10px 30px -5px rgba(225, 29, 72, 0.05);
        }

        .light-input {
            background: #ffffff;
            border: 1px solid #fecdd3;
            color: #1e293b;
            transition: all 0.25s ease;
        }

        .light-input:focus {
            border-color: #f43f5e;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.1);
        }

        /* Custom Modern Range Slider (Light Theme) */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: linear-gradient(90deg, #f43f5e, #fb7185);
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #f43f5e;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 4px 10px rgba(244, 63, 94, 0.25);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #fff1f2;
        }
        ::-webkit-scrollbar-thumb {
            background: #fda4af;
            border-radius: 10px;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body class="light-bg text-slate-800 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white antialiased">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-rose-100 py-3.5 px-6 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center shadow-md shadow-rose-200">
                    <span class="text-lg">💖</span>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-rose-600">Feely</h1>
                </div>
            </div>
            <button onclick="requestNotificationPermission()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-xl font-medium transition active:scale-95 flex items-center gap-1.5">
                <span>🔔</span>
                <span>الإشعارات</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-md mx-auto w-full p-4 flex-grow flex flex-col justify-center space-y-4">
        
        <!-- Custom Fixed ID Card -->
        <div class="light-card rounded-3xl p-5 space-y-3 relative overflow-hidden">
            <div class="text-center space-y-0.5">
                <h2 class="text-xs font-bold text-rose-600 tracking-wide">رمز الاستقبال الخاص بك 🔑</h2>
                <p class="text-[11px] text-slate-500 font-light">اختر رمزك الثابت وشاركه مع الآخرين لاستلام نبضاتهم</p>
            </div>
            
            <div class="flex gap-2">
                <input type="text" id="myCustomIdInput" placeholder="اكتب رمزك (مثال: AHMED2026)" 
                       class="light-input w-full px-4 py-2.5 text-xs rounded-2xl outline-none text-center font-bold tracking-widest text-rose-600 uppercase placeholder:text-slate-400">
                <button onclick="saveMyCustomId()" class="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold px-5 py-2.5 rounded-2xl text-xs whitespace-nowrap shadow-md shadow-rose-200 transition active:scale-95">
                    حفظ
                </button>
            </div>
            <p id="idSavedAlert" class="text-[10px] text-emerald-600 font-medium text-center hidden">✓ تم تفعيل الرمز وحفظه بنجاح</p>
        </div>

        <!-- Send Pulse Card -->
        <div class="light-card rounded-3xl p-6 space-y-4 relative overflow-hidden">
            <div class="border-b border-rose-100 pb-3">
                <h3 class="text-sm font-bold text-slate-900">إرسال نبضة حب 💌</h3>
                <p class="text-[11px] text-slate-500 font-light mt-0.5">أدخل رمز المستلم وعبّر عن مشاعرك الآن</p>
            </div>

            <form onsubmit="sendLovePulse(event)" class="space-y-3.5">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">رمز المستلم</label>
                        <input type="text" id="targetIdInput" placeholder="مثل: AHMED2026" required
                               class="light-input w-full px-3 py-2.5 text-xs rounded-xl outline-none font-semibold uppercase placeholder:text-slate-400">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">اسمك</label>
                        <input type="text" id="senderNameInput" placeholder="اسمك أو مجهول" 
                               class="light-input w-full px-3 py-2.5 text-xs rounded-xl outline-none placeholder:text-slate-400">
                    </div>
                </div>
                
                <div class="bg-rose-50/60 p-3.5 rounded-2xl border border-rose-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-semibold text-rose-800">درجة الحب اليوم</label>
                        <span id="rangeDisplay" class="text-xs font-bold text-rose-600 bg-white px-2.5 py-0.5 rounded-lg border border-rose-200 shadow-xs">85%</span>
                    </div>
                    <input type="range" id="loveSlider" min="1" max="100" value="85" oninput="document.getElementById('rangeDisplay').textContent = this.value + '%'" class="w-full">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">رسالة خاصة (اختياري)</label>
                    <textarea id="loveNote" rows="2" placeholder="كلمة دافئة أو موقف خفيف..." 
                              class="light-input w-full px-3 py-2.5 text-xs rounded-xl outline-none resize-none placeholder:text-slate-400"></textarea>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 hover:opacity-95 text-white font-bold py-3.5 rounded-2xl text-xs shadow-lg shadow-rose-200 active:scale-[0.98] transition duration-200 flex items-center justify-center gap-2">
                    <span>إرسال النبضة فوريّاً</span>
                    <span class="text-sm">💖</span>
                </button>
            </form>
        </div>

        <!-- Incoming Pulses Feed -->
        <div class="light-card rounded-3xl p-5 space-y-3">
            <div class="flex justify-between items-center border-b border-rose-100 pb-2.5">
                <h3 class="text-xs font-bold text-slate-900">النبضات الواردة 📬</h3>
                <span id="pulsesCount" class="text-[10px] bg-rose-100 text-rose-700 border border-rose-200 px-2.5 py-0.5 rounded-full font-bold">0</span>
            </div>

            <div id="pulsesList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <p class="text-center text-xs text-slate-400 py-6 font-light">أدخل رمزك الثابت بالأعلى وأحفظه لتتمكن من استقبال النبضات</p>
            </div>
        </div>

    </main>

    <footer class="py-3 text-center text-[11px] text-slate-400 border-t border-rose-100 bg-white/50">
        Feely App &copy; 2026 • صُمم بحب
    </footer>

    <!-- Firebase Script Logic -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCZLJ3VX05H05lTFWt3obbqVK71_jgaffs",
          authDomain: "feely-813ca.firebaseapp.com",
          databaseURL: "https://feely-813ca-default-rtdb.firebaseio.com",
          projectId: "feely-813ca",
          storageBucket: "feely-813ca.firebasestorage.app",
          messagingSenderId: "945704178477",
          appId: "1:945704178477:web:7ec595932e9e56699539a4",
          measurementId: "G-N8JF3818SX"
        };

        const VAPID_KEY = "BPkYkURSeV4Z0mzKfGfXjmC_eUWS25t6XjQDN9bsfS6gD2eebQiK-tIvWQSRIxEPSBHIyo26cz_50Xq0fvO8hEM";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messaging = firebase.messaging();

        let currentPulseListener = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedId = localStorage.getItem('feely_custom_id');
            if (savedId) {
                document.getElementById('myCustomIdInput').value = savedId;
                listenForIncomingPulses(savedId);
            }
        });

        function saveMyCustomId() {
            const customId = document.getElementById('myCustomIdInput').value.trim().toUpperCase();
            if (!customId) return alert('يرجى كتابة رمز خاص بك أولاً');

            localStorage.setItem('feely_custom_id', customId);
            
            const alertBox = document.getElementById('idSavedAlert');
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3000);

            listenForIncomingPulses(customId);
        }

        function sendLovePulse(e) {
            e.preventDefault();
            const targetId = document.getElementById('targetIdInput').value.trim().toUpperCase();
            const senderName = document.getElementById('senderNameInput').value.trim() || 'مجهول';
            const score = document.getElementById('loveSlider').value;
            const note = document.getElementById('loveNote').value.trim();

            if (!targetId) return alert('يرجى إدخال رمز المستلم');

            db.ref('user_pulses/' + targetId).push({
                sender: senderName,
                score: score,
                note: note,
                timestamp: Date.now()
            }).then(() => {
                alert('تم إرسال النبضة بنجاح! 💕');
                document.getElementById('loveNote').value = '';
            }).catch(err => {
                alert('حدث خطأ أثناء الإرسال: ' + err.message);
            });
        }

        function listenForIncomingPulses(userId) {
            if (currentPulseListener) {
                db.ref('user_pulses/' + currentPulseListener).off();
            }

            currentPulseListener = userId;
            let totalPulses = 0;
            const list = document.getElementById('pulsesList');
            list.innerHTML = '<p class="text-center text-xs text-slate-400 py-6 font-light">لا توجد نبضات واصلة حتى الآن لهذا الرمز</p>';
            document.getElementById('pulsesCount').textContent = "0";

            db.ref('user_pulses/' + userId).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (totalPulses === 0) list.innerHTML = '';
                    
                    totalPulses++;
                    document.getElementById('pulsesCount').textContent = totalPulses;

                    const dateStr = new Date(data.timestamp).toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'});

                    const pulseCard = document.createElement('div');
                    pulseCard.className = "bg-white p-3 rounded-2xl border border-rose-100 space-y-1 shadow-xs hover:border-rose-300 transition";
                    pulseCard.innerHTML = `
                        <div class="flex justify-between items-center text-[10px] text-slate-400 font-medium">
                            <span>من: <strong class="text-rose-600 font-semibold">${data.sender}</strong></span>
                            <span class="text-slate-400">${dateStr}</span>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-xs font-normal text-slate-700">${data.note ? `"${data.note}"` : 'أرسل لك نبضة حب'}</span>
                            <span class="text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 px-2.5 py-0.5 rounded-lg whitespace-nowrap">${data.score}%</span>
                        </div>
                    `;
                    list.prepend(pulseCard);
                }
            });
        }

        function requestNotificationPermission() {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    messaging.getToken({ vapidKey: VAPID_KEY }).then((token) => {
                        console.log('FCM Token:', token);
                        alert('تم تفعيل الإشعارات بنجاح!');
                    });
                } else {
                    alert('تم رفض إذن الإشعارات.');
                }
            });
        }
    </script>
</body>
</html>

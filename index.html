<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feely</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Readex Pro', sans-serif; 
        }

        .light-bg {
            background-color: #fcf8fa;
            background-image: 
                radial-gradient(at 0% 0%, rgba(253, 242, 248, 1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 228, 230, 0.7) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(254, 205, 211, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .light-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 63, 94, 0.12);
            box-shadow: 0 10px 30px -5px rgba(225, 29, 72, 0.05);
        }

        .light-input {
            background: #ffffff;
            border: 1px solid #fecdd3;
            color: #1e293b;
            transition: all 0.25s ease;
        }

        .light-input:focus {
            border-color: #f43f5e;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.1);
        }

        .light-input:disabled {
            background-color: #fff1f2;
            color: #e11d48;
            border-color: #fecdd3;
            cursor: not-allowed;
            opacity: 0.9;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: linear-gradient(90deg, #f43f5e, #fb7185);
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #f43f5e;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 4px 10px rgba(244, 63, 94, 0.25);
            transition: transform 0.1s ease;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #fff1f2; }
        ::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 10px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- مكتبة Firebase Messaging للإشعارات -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body class="light-bg text-slate-800 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white antialiased">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-rose-100 py-3.5 px-6 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center shadow-md shadow-rose-200">
                    <span class="text-lg">💖</span>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-rose-600">Feely</h1>
                </div>
            </div>
            
            <div id="authStatusContainer">
                <button id="googleLoginBtn" onclick="loginWithGoogle()" class="text-xs bg-white hover:bg-rose-50 text-slate-700 border border-rose-200 px-3 py-1.5 rounded-xl font-medium transition shadow-xs flex items-center gap-1.5">
                    <span>🔑</span>
                    <span>تسجيل الدخول</span>
                </button>
                <button id="logoutBtn" onclick="logout()" class="hidden text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-xl font-medium transition">
                    تسجيل الخروج
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-md mx-auto w-full p-4 flex-grow flex flex-col justify-center space-y-4">

        <!-- Receiver Handle Card -->
        <div id="handleSetupCard" class="light-card rounded-3xl p-5 space-y-3 relative overflow-hidden">
            <div class="text-center space-y-0.5">
                <h2 id="handleCardTitle" class="text-xs font-bold text-rose-600 tracking-wide">رمز الاستقبال الخاص بك 🔑</h2>
                <p id="handleCardSubtitle" class="text-[11px] text-slate-500 font-light">يسمح بالحروف الإنجليزية، الأرقام والشرطة السفلية (_) • الحد الأدنى 5 خانات</p>
            </div>
            
            <div class="flex gap-2">
                <input type="text" id="usernameInput" placeholder="مثال: ahmed_2026 أو A" 
                       class="light-input w-full px-4 py-2.5 text-xs rounded-2xl outline-none text-center font-bold tracking-widest text-rose-600 placeholder:text-slate-400">
                
                <button id="handleActionBtn" onclick="registerHandle()" class="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold px-5 py-2.5 rounded-2xl text-xs whitespace-nowrap shadow-md shadow-rose-200 transition active:scale-95">
                    حفظ
                </button>
                <button id="shareLinkBtn" onclick="shareMyLink()" class="hidden bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold px-3 py-2.5 rounded-2xl text-xs whitespace-nowrap shadow-md shadow-rose-200 transition active:scale-95">
                    مشاركة 📲
                </button>
            </div>
            <p id="handleStatusAlert" class="text-[10px] text-center hidden font-medium"></p>
        </div>

        <!-- Send Pulse Card -->
        <div class="light-card rounded-3xl p-6 space-y-4 relative overflow-hidden">
            <div class="border-b border-rose-100 pb-3">
                <h3 class="text-sm font-bold text-slate-900">إرسال نبضة حب 💌</h3>
                <p class="text-[11px] text-slate-500 font-light mt-0.5">أدخل رمز المستلم وعبّر عن مشاعرك الآن</p>
            </div>

            <form onsubmit="sendLovePulse(event)" class="space-y-3.5">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">رمز المستلم</label>
                        <input type="text" id="targetIdInput" placeholder="مثل: ahmed_2026" required
                               class="light-input w-full px-3 py-2.5 text-xs rounded-xl outline-none font-semibold placeholder:text-slate-400">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">اسمك</label>
                        <input type="text" id="senderNameInput" placeholder="اسمك أو مجهول" 
                               class="light-input w-full px-3 py-2.5 text-xs rounded-xl outline-none placeholder:text-slate-400">
                    </div>
                </div>
                
                <div class="bg-rose-50/60 p-3.5 rounded-2xl border border-rose-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-semibold text-rose-800">درجة الحب اليوم</label>
                        <span id="rangeDisplay" class="text-xs font-bold text-rose-600 bg-white px-2.5 py-0.5 rounded-lg border border-rose-200">85%</span>
                    </div>
                    <input type="range" id="loveSlider" min="1" max="100" value="85" oninput="document.getElementById('rangeDisplay').textContent = this.value + '%'" class="w-full">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">رسالة خاصة (اختياري)</label>
                    <textarea id="loveNote" rows="2" placeholder="كلمة دافئة أو موقف خفيف..." 
                              class="light-input w-full px-3 py-2.5 text-xs rounded-xl outline-none resize-none placeholder:text-slate-400"></textarea>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 hover:opacity-95 text-white font-bold py-3.5 rounded-2xl text-xs shadow-lg shadow-rose-200 active:scale-[0.98] transition flex items-center justify-center gap-2">
                    <span>إرسال النبضة فوريّاً</span>
                    <span class="text-sm">💖</span>
                </button>
            </form>
        </div>

        <!-- Pulses Feed (Incoming & Sent Tabs) -->
        <div class="light-card rounded-3xl p-5 space-y-3">
            <div class="flex justify-between items-center border-b border-rose-100 pb-2.5">
                <div class="flex gap-2 bg-rose-50/80 p-1 rounded-xl border border-rose-100">
                    <button id="tabIncomingBtn" onclick="switchPulseTab('incoming')" class="px-3 py-1 rounded-lg text-xs font-bold transition bg-white text-rose-600 shadow-xs">
                        الواردة 📬
                    </button>
                    <button id="tabSentBtn" onclick="switchPulseTab('sent')" class="px-3 py-1 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600">
                        المرسلة 📤
                    </button>
                </div>
                <span id="pulsesCount" class="text-[10px] bg-rose-100 text-rose-700 border border-rose-200 px-2.5 py-0.5 rounded-full font-bold">0</span>
            </div>

            <!-- List Container -->
            <div id="pulsesList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <p id="authNotice" class="text-center text-xs text-slate-400 py-6 font-light">قم بحفظ رمز الاستقبال لمشاهدة النبضات الواردة</p>
            </div>
        </div>

    </main>

    <footer class="py-3 text-center text-[11px] text-slate-400 border-t border-rose-100 bg-white/50">
        Feely App &copy; 2026 • صُمم بحب
    </footer>

    <!-- Firebase Script Logic -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCZLJ3VX05H05lTFWt3obbqVK71_jgaffs",
          authDomain: "feely-813ca.firebaseapp.com",
          databaseURL: "https://feely-813ca-default-rtdb.firebaseio.com",
          projectId: "feely-813ca",
          storageBucket: "feely-813ca.firebasestorage.app",
          messagingSenderId: "945704178477",
          appId: "1:945704178477:web:7ec595932e9e56699539a4",
          measurementId: "G-N8JF3818SX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let messaging = null;
        try {
            messaging = firebase.messaging();
        } catch (e) {
            console.log("Firebase Messaging not supported in this browser context.");
        }

        let currentUser = null;
        let userHandle = localStorage.getItem('feely_user_handle') || null;
        let activeTab = 'incoming'; // 'incoming' or 'sent'
        
        let incomingPulses = [];
        let sentPulses = JSON.parse(localStorage.getItem('feely_sent_pulses') || '[]');
        let isFirstPulseLoad = true;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userParam = urlParams.get('u');
            if (userParam) {
                document.getElementById('targetIdInput').value = userParam;
            }

            if (userHandle) {
                setHandleLockedState(userHandle);
                listenForIncomingPulses(userHandle);
                initPushNotifications(userHandle);
            } else {
                setHandleEditableState();
            }

            renderPulsesList();
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('googleLoginBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                
                if (userHandle) {
                    db.ref('handles/' + userHandle).set(user.uid);
                    db.ref('users/' + user.uid).set({
                        handle: userHandle,
                        email: user.email
                    });
                    listenForIncomingPulses(userHandle);
                    initPushNotifications(userHandle);
                }
            } else {
                currentUser = null;
                document.getElementById('googleLoginBtn').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("حدث خطأ في التسجيل: " + err.message));
        }

        function logout() {
            auth.signOut();
        }

        function setHandleLockedState(handle) {
            const input = document.getElementById('usernameInput');
            const btn = document.getElementById('handleActionBtn');
            const shareBtn = document.getElementById('shareLinkBtn');
            const subtitle = document.getElementById('handleCardSubtitle');
            
            input.value = handle;
            input.disabled = true;
            
            subtitle.textContent = "تم حفظ رمزك بنجاح، يمكنك الآن نسخ الرمز ومشاركته";
            
            btn.innerHTML = '<span>نسخ</span> 📋';
            btn.onclick = copyMyLink;
            btn.className = "bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold px-3 py-2.5 rounded-2xl text-xs whitespace-nowrap transition active:scale-95 flex items-center gap-1";

            if (shareBtn) {
                shareBtn.classList.remove('hidden');
            }
        }

        function setHandleEditableState() {
            const input = document.getElementById('usernameInput');
            const btn = document.getElementById('handleActionBtn');
            const shareBtn = document.getElementById('shareLinkBtn');
            const subtitle = document.getElementById('handleCardSubtitle');

            input.value = '';
            input.disabled = false;
            
            subtitle.textContent = "يسمح بالحروف الإنجليزية، الأرقام والشرطة السفلية (_) • الحد الأدنى 5 خانات";
            
            btn.textContent = "حفظ";
            btn.onclick = registerHandle;
            btn.className = "bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold px-5 py-2.5 rounded-2xl text-xs whitespace-nowrap shadow-md shadow-rose-200 transition active:scale-95";

            if (shareBtn) {
                shareBtn.classList.add('hidden');
            }
        }

        function registerHandle() {
            const handle = document.getElementById('usernameInput').value.trim();
            const alertBox = document.getElementById('handleStatusAlert');
            
            const validRegex = /^[a-zA-Z0-9_]+$/;
            if (!validRegex.test(handle)) {
                alertBox.textContent = "يُسمح فقط بالحروف الإنجليزية، الأرقام والشرطة السفلية (_)";
                alertBox.className = "text-[10px] text-center font-medium text-rose-500 block";
                return;
            }

            if (handle !== 'A' && handle.length < 5) {
                alertBox.textContent = "رمز الاستقبال يجب ألا يقل عن 5 خانات";
                alertBox.className = "text-[10px] text-center font-medium text-rose-500 block";
                return;
            }

            db.ref('handles/' + handle).once('value', snapshot => {
                if (snapshot.exists() && snapshot.val() !== 'registered') {
                    alertBox.textContent = "هذا الرمز مسجل مسبقاً، يرجى اختيار رمز آخر";
                    alertBox.className = "text-[10px] text-center font-medium text-rose-500 block";
                } else {
                    localStorage.setItem('feely_user_handle', handle);
                    userHandle = handle;

                    const ownerId = currentUser ? currentUser.uid : 'anonymous_registered';
                    db.ref('handles/' + handle).set(ownerId);

                    if (currentUser) {
                        db.ref('users/' + currentUser.uid).set({
                            handle: handle,
                            email: currentUser.email
                        });
                    }

                    alertBox.className = "hidden";
                    setHandleLockedState(userHandle);
                    listenForIncomingPulses(userHandle);
                    initPushNotifications(userHandle);
                }
            });
        }

        function getMyShareableLink() {
            return window.location.origin + window.location.pathname + '?u=' + userHandle;
        }

        function copyMyLink() {
            const link = getMyShareableLink();
            navigator.clipboard.writeText(link);
            alert("تم نسخ رابطك الخاص بنجاح! 📋\n" + link);
        }

        function shareMyLink() {
            const link = getMyShareableLink();
            if (navigator.share) {
                navigator.share({
                    title: 'Feely - شاركني نبضات الحب 💖',
                    text: 'أرسل لي نبضة حب عبر هذا الرابط:',
                    url: link
                }).catch(() => {});
            } else {
                copyMyLink();
            }
        }

        function switchPulseTab(tab) {
            activeTab = tab;
            const incomingBtn = document.getElementById('tabIncomingBtn');
            const sentBtn = document.getElementById('tabSentBtn');

            if (tab === 'incoming') {
                incomingBtn.className = "px-3 py-1 rounded-lg text-xs font-bold transition bg-white text-rose-600 shadow-xs";
                sentBtn.className = "px-3 py-1 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600";
            } else {
                sentBtn.className = "px-3 py-1 rounded-lg text-xs font-bold transition bg-white text-rose-600 shadow-xs";
                incomingBtn.className = "px-3 py-1 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600";
            }

            renderPulsesList();
        }

        function sendLovePulse(e) {
            e.preventDefault();
            const targetHandle = document.getElementById('targetIdInput').value.trim();
            const senderName = document.getElementById('senderNameInput').value.trim() || 'مجهول';
            const score = document.getElementById('loveSlider').value;
            const note = document.getElementById('loveNote').value.trim();

            if (!targetHandle) return alert('يرجى إدخال رمز المستلم');

            db.ref('handles/' + targetHandle).once('value', snapshot => {
                if (!snapshot.exists()) {
                    return alert('رمز المستلم غير موجود، تأكد من صحة الرمز');
                }

                const pulseData = {
                    target: targetHandle,
                    sender: senderName,
                    score: score,
                    note: note,
                    timestamp: Date.now()
                };

                // 1. الحفظ في Firebase لرمز المستلم
                db.ref('pulses/' + targetHandle).push(pulseData).then(() => {
                    // 2. الحفظ محلياً في سجل المرسلات
                    sentPulses.unshift(pulseData);
                    localStorage.setItem('feely_sent_pulses', JSON.stringify(sentPulses));

                    alert('تم إرسال النبضة بنجاح! 💕');
                    document.getElementById('loveNote').value = '';

                    // تحديث قائمة المرسلات إذا كان التبويب مفعل
                    if (activeTab === 'sent') {
                        renderPulsesList();
                    }
                }).catch(err => {
                    alert('حدث خطأ أثناء الإرسال: ' + err.message);
                });
            });
        }

        function listenForIncomingPulses(handle) {
            db.ref('pulses/' + handle).on('value', (snapshot) => {
                incomingPulses = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        incomingPulses.unshift(data[key]);
                    });
                    
                    // إرسال إشعار للمستخدم عند وصول نبضة جديدة والموقع مفتوح
                    if (!isFirstPulseLoad && incomingPulses.length > 0) {
                        const latestPulse = incomingPulses[0];
                        showLocalNotification(latestPulse);
                    }
                }
                isFirstPulseLoad = false;
                
                if (activeTab === 'incoming') {
                    renderPulsesList();
                }
            });
        }

        // تفعيل طلب الإشعارات وحفظ التوكن
        function initPushNotifications(handle) {
            if ("Notification" in window && messaging) {
                Notification.requestPermission().then((permission) => {
                    if (permission === 'granted' && 'serviceWorker' in navigator) {
                        navigator.serviceWorker.register('/firebase-messaging-sw.js')
                        .then((registration) => {
                            return messaging.getToken({ 
                                serviceWorkerRegistration: registration,
                                vapidKey: 'BD8T3W-78T3W-EXAMPLE-VAPID-KEY' // استبدل المفتاح الخاص بك هنا عند الربط الفعلي بـ FCM
                            });
                        })
                        .then((currentToken) => {
                            if (currentToken) {
                                db.ref('fcmTokens/' + handle).set(currentToken);
                            }
                        })
                        .catch((err) => {
                            console.log('ملاحظة: تفعيل Service Worker يتطلب استضافة HTTPS والمفتاح VAPID الصحيح.', err);
                        });
                    }
                });
            }
        }

        // إظهار إشعار النظام المباشر
        function showLocalNotification(pulse) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("نبضة جديدة 💖", {
                    body: `من: ${pulse.sender} (${pulse.score}%)` + (pulse.note ? `\n"${pulse.note}"` : ''),
                    icon: "https://cdn-icons-png.flaticon.com/512/2589/2589175.png"
                });
            }
        }

        function renderPulsesList() {
            const list = document.getElementById('pulsesList');
            const countLabel = document.getElementById('pulsesCount');
            list.innerHTML = '';

            const currentData = activeTab === 'incoming' ? incomingPulses : sentPulses;
            countLabel.textContent = currentData.length;

            if (currentData.length === 0) {
                const emptyText = activeTab === 'incoming' 
                    ? (userHandle ? 'لا توجد نبضات واصلة حتى الآن' : 'قم بحفظ رمز الاستقبال لمشاهدة النبضات الواردة')
                    : 'لم تقم بإرسال أي نبضات بعد';
                list.innerHTML = `<p class="text-center text-xs text-slate-400 py-6 font-light">${emptyText}</p>`;
                return;
            }

            currentData.forEach(item => {
                const dateStr = new Date(item.timestamp).toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'});
                const titleText = activeTab === 'incoming' 
                    ? `من: <strong class="text-rose-600 font-semibold">${item.sender}</strong>`
                    : `إلى: <strong class="text-rose-600 font-semibold">${item.target}</strong>`;

                const pulseCard = document.createElement('div');
                pulseCard.className = "bg-white p-3 rounded-2xl border border-rose-100 space-y-1 shadow-xs hover:border-rose-300 transition";
                pulseCard.innerHTML = `
                    <div class="flex justify-between items-center text-[10px] text-slate-400 font-medium">
                        <span>${titleText}</span>
                        <span class="text-slate-400">${dateStr}</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-normal text-slate-700">${item.note ? `"${item.note}"` : 'نبضة حب'}</span>
                        <span class="text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 px-2.5 py-0.5 rounded-lg whitespace-nowrap">${item.score}%</span>
                    </div>
                `;
                list.appendChild(pulseCard);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FBF8F5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Feely">
    <title>Feely</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            font-family: 'Readex Pro', sans-serif;
            background-color: #FBF8F5;
            background-image: none;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            padding-top: var(--safe-top);
            padding-bottom: calc(1.75rem + var(--safe-bottom));
        }

        /* Pure Beige Cards */
        .glass-card {
            background: #f5efe6;
            border-radius: 30px;
            box-shadow: 0 10px 26px -14px rgba(159, 18, 57, 0.12), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            border: 1px solid #e7ddd0;
        }

        .soft-input {
            background: #ffffff;
            border: 1.5px solid #dfd3c3;
            color: #1e293b;
            border-radius: 18px;
            font-size: 16px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .soft-input:focus {
            border-color: #b91c3c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(185, 28, 60, 0.12);
        }

        /* Compact Beige Box Inputs */
        .white-compact-box {
            background: #fbf8f5;
            border: 1.5px solid #dfd3c3;
            border-radius: 16px;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .white-compact-box:focus-within {
            border-color: #b91c3c;
            background: #f7f2ea;
            box-shadow: 0 0 0 3px rgba(185, 28, 60, 0.12);
        }

        /* Locked Beige Box Input for Sheet Note (keeps same border color on focus) */
        .sheet-note-box {
            background: #fbf8f5;
            border: 1.5px solid #dfd3c3;
            border-radius: 20px;
        }

        /* Unified Right-Aligned Small Field Typography */
        .unified-field-text {
            font-family: 'Readex Pro', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            color: #334155;
        }

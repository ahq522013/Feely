<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feely - أرسل نبضة حب</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Readex Pro', sans-serif; background-color: #fdf8f8; overflow-x: hidden; }

        .minimal-card {
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 10px 30px -10px rgba(230, 150, 160, 0.12);
            border: 1px solid rgba(252, 230, 233, 0.8);
        }

        .minimal-input {
            background: #fbf1f2;
            border: 1px solid transparent;
            color: #4a3e3e;
            border-radius: 24px;
            transition: all 0.2s ease;
        }

        .minimal-input:focus {
            border-color: #f49fa9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(244, 159, 169, 0.15);
        }

        /* Custom Soft Slider */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer;
            border-radius: 999px;
            background: #fcedee;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 24px; width: 24px; border-radius: 50%;
            background: #ffffff; border: 4px solid #f43f5e; cursor: pointer;
            -webkit-appearance: none; margin-top: -8px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
            transition: transform 0.1s ease;
        }

        /* Floating Hearts Animation */
        @keyframes floatHeartUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(-85vh) scale(1.35) rotate(var(--rot, 20deg));
                opacity: 0;
            }
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            z-index: 9999;
            animation: floatHeartUp var(--dur, 2.5s) cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            user-select: none;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #fdf8f8; }
        ::-webkit-scrollbar-thumb { background: #f8c8d0; border-radius: 10px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="w-full max-w-md mx-auto px-6 pt-6 flex justify-between items-center">
        <div id="authStatusContainer" class="flex items-center gap-1.5">
            <button id="openAuthModalBtn" onclick="openAuthModal()" class="flex items-center gap-1.5 text-xs font-bold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200/80 px-3.5 py-2 rounded-full transition shadow-xs">
                <span>[➔</span>
                <span>دخول (اختياري)</span>
            </button>
            <button id="logoutBtn" onclick="logout()" class="hidden text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3.5 py-2 rounded-full transition">
                خروج
            </button>

            <!-- زر الصوت التفاعلي -->
            <button id="soundToggleBtn" onclick="toggleSoundEffect()" title="نغمة النبض" 
                    class="grid size-8 place-items-center rounded-full bg-white text-slate-600 hover:bg-slate-50 transition border border-slate-200/60 shadow-xs">
                <span id="soundIcon" class="text-xs">🔊</span>
            </button>

            <button id="notificationBellBtn" onclick="toggleNotificationPermission()" title="الإشعارات" 
                    class="relative grid size-8 place-items-center rounded-full bg-white text-slate-600 hover:bg-slate-50 transition border border-slate-200/60 shadow-xs">
                <span id="bellIcon" class="text-xs">🔔</span>
                <span id="bellBadge" class="hidden absolute right-1 top-1 size-2 rounded-full bg-rose-500"></span>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <h1 class="text-xl font-black text-slate-900 tracking-tight">Feely</h1>
            <div class="w-9 h-9 rounded-full bg-rose-500 flex items-center justify-center text-white text-lg shadow-md shadow-rose-200">
                ❤️
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-md mx-auto px-4 py-6 space-y-4 flex-grow">

        <!-- Receive Code Card -->
        <section class="minimal-card p-6 relative overflow-hidden space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-black text-rose-500 bg-rose-50 border border-rose-100 px-3 py-1 rounded-full shadow-2xs" id="totalHeartsReceivedBadge">
                    0 ❤️ وصلك
                </span>
                <p class="text-xs font-bold text-slate-400">رمزك الخاص</p>
            </div>

            <div class="flex items-center justify-between gap-2 bg-[#fbf1f2] rounded-2xl px-4 py-2 border border-rose-100/60">
                <button type="button" id="copyBtn" onclick="copyMyLink()" title="نسخ الرابط"
                        class="p-2 text-slate-600 hover:text-rose-500 hover:bg-white rounded-xl transition active:scale-90 shadow-2xs">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </button>

                <div class="flex-1 text-center font-mono text-xl font-black tracking-[0.35em] text-slate-900 uppercase">
                    <input type="text" id="usernameInput" 
                           class="bg-transparent text-center font-mono text-xl font-black tracking-[0.35em] text-slate-900 outline-none w-full"
                           placeholder="FEELYOU">
                </div>
            </div>

            <div class="pt-1">
                <button id="handleActionBtn" onclick="registerHandle()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl text-xs shadow-md transition active:scale-95">
                    حفظ الرمز وتفعيله فوراً
                </button>
            </div>
            <p id="handleStatusAlert" class="text-[10px] text-center hidden font-medium"></p>
        </section>

        <!-- Quick Contacts Bar -->
        <section id="recentContactsSection" class="hidden minimal-card p-4 space-y-2 border border-rose-100/70">
            <div class="flex items-center justify-between">
                <span class="text-[10px] text-slate-400 font-medium">اضغط للإرسال المباشر</span>
                <h3 class="text-xs font-bold text-slate-800 flex items-center gap-1">
                    <span>أصدقاء النبض</span>
                    <span>✨</span>
                </h3>
            </div>
            <div id="recentContactsList" class="flex gap-2 overflow-x-auto pb-1 pt-1 hide-scrollbar"></div>
        </section>

        <!-- Send Pulse Card -->
        <section class="minimal-card p-6 space-y-5">
            <div class="text-center space-y-1.5 pt-2">
                <div id="mainHeartOrb" onclick="triggerFloatingHearts(8); playHeartbeatSound();" class="inline-flex items-center justify-center w-20 h-20 text-5xl animate-pulse cursor-pointer select-none transition-transform active:scale-125">
                    ❤️
                </div>
                <h2 class="text-xl font-black text-slate-900">أرسل نبضة حب</h2>
                <p id="moodLabel" class="text-xs font-bold text-[#f43f5e]">حب كبير</p>
            </div>

            <form onsubmit="sendLovePulse(event)" class="space-y-4">
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span id="targetStreakIndicator" class="hidden text-[11px] font-black text-rose-500 bg-rose-50 border border-rose-200/60 px-2 py-0.5 rounded-full">
                            ❤️ ستريك: 0 أيام
                        </span>
                        <label class="block text-xs font-bold text-slate-400 text-right">رمز المستلم</label>
                    </div>
                    <input type="text" id="targetIdInput" required placeholder="ABC123" oninput="checkTargetStreak(this.value)"
                           class="minimal-input w-full px-4 py-3.5 text-center font-mono font-bold tracking-widest text-slate-800 text-sm outline-none uppercase">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 text-right mb-1.5">اسمك (اختياري)</label>
                    <input type="text" id="senderNameInput" placeholder="مجهول"
                           class="minimal-input w-full px-4 py-3 text-right text-xs text-slate-800 outline-none">
                </div>

                <!-- Slider -->
                <div class="space-y-2 pt-1">
                    <div class="flex justify-between items-center text-xs font-bold">
                        <span id="rangeDisplay" class="text-[#f43f5e] font-black">75%</span>
                        <span class="text-slate-900">درجة الحب</span>
                    </div>
                    <input type="range" id="loveSlider" min="1" max="100" value="75" oninput="updateOrb(this.value)" class="w-full">
                </div>

                <!-- Input Field -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 text-right mb-1.5">رسالة (اختياري)</label>
                    <textarea id="loveNote" rows="3" maxlength="140" placeholder="اكتب ما في قلبك…"
                              class="minimal-input w-full p-4 text-right text-xs text-slate-800 outline-none resize-none rounded-3xl"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-[#f39fa9] hover:bg-[#f18d98] text-white font-bold py-3.5 rounded-full text-sm flex items-center justify-center gap-2 transition active:scale-95 shadow-xs">
                    <span>إرسال النبضة</span>
                    <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
        </section>

        <!-- Pulse Inbox Section -->
        <section class="minimal-card p-5 space-y-4">
            <div class="bg-[#fbf1f2] p-1.5 rounded-full flex gap-1">
                <button id="tabIncomingBtn" onclick="switchPulseTab('incoming')" class="flex-1 py-2.5 rounded-full text-xs font-bold transition bg-white text-slate-900 shadow-xs">
                    الواردة
                </button>
                <button id="tabSentBtn" onclick="switchPulseTab('sent')" class="flex-1 py-2.5 rounded-full text-xs font-bold transition text-slate-500 hover:text-slate-800">
                    المرسلة
                </button>
            </div>

            <div id="pulsesList" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                <p id="authNotice" class="text-center text-xs text-slate-400 py-6 font-medium">احفظ رمزك أعلاه لمشاهدة النبضات الواردة</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="mt-6 text-center text-xs text-slate-400 py-5">
        صُمم بحب · Feely App © 2026
    </footer>

    <!-- Auth Modal -->
    <div id="authModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 border border-rose-100 shadow-2xl relative text-right">
            <button onclick="closeAuthModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            
            <div class="text-center space-y-1.5">
                <div class="w-12
